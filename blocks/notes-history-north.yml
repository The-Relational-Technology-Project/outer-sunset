    kind: history
    at: 46th Ave & Lawton
    lat: 37.756694
    lng: -122.505665
    years: 1890s-1910s
    text: Carville was not only houses. Many of the old horsecars and cable cars hauled out to the dunes became clubhouses. A women's bicycling club called the Falcons had one, a band of working musicians named theirs La Boheme, and a group of professional men who liked to walk on the beach, the Barefoot Club, used a car as their clubhouse at 46th Avenue and Lawton. By about 1910 the streetcar settlement stretched from Lincoln Way south to Moraga Street, so this was near its inland edge.

    text: Henry Doelger, who became the biggest home builder in the country in the 1930s, built his first Sunset house in 1927 on 39th Avenue, a barrel-front single-family home. Later that year he began his first tract on the same block, and the solid row of Mediterranean Revival houses on 39th between Judah and Kirkham remains largely intact. For years people thought the first house was a different one on the block. A 1954 San Francisco News article settled it, though it misprinted the address as 36th Avenue. FoundSF dates the Doelgers' start on 39th Avenue to 1926.

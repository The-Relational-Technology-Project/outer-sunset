  - id: builder-ray-galli-lived-on-his-own-tract
    title: Builder Ray Galli lived on his own tract
    kind: history
    at: 28th Ave between Kirkham and Lawton
    lat: 37.758474
    lng: -122.486447
    years: 1928-1930
    text: Ray Galli, born in San Francisco in 1896, kept books for an Oakland dairy before starting a building company with his savings in 1925. The 1930 census found him, his wife Bernadine and their son Raymond Jr. living on 28th Avenue, between Kirkham and Lawton, with his occupation listed as contractor and builder. The house was part of a tract Galli himself built in 1928 and 1929. He went on to become one of the Sunset's major merchant builders, alongside Henry Doelger, the Gellert brothers, the Stonesons and Chris McKeon, and his firm built thousands of homes on the west side.
    tags:

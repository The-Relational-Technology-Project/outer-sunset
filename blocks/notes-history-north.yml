    years: 1912-1957
    text: A firehouse was one of the things Oceanside's improvement clubs lobbied for. The fire station at 1348 45th Avenue, between Irving and Judah, opened in 1912 as quarters for Chemical Engine Company 12. In 1913 Engine Company 45 was assigned there. The house was rebuilt in the 1950s, with the company returning in April 1957. Jack Goldsworthy, born in 1926, grew up in a rented house on this block and remembered 'the old firehouse' and that 'in those days, it was all sand dunes,' with a 25-foot lot selling for 300 dollars.

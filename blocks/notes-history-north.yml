    extent: block bounded by 28th Ave, 29th Ave, Lawton and Moraga
    years: 1937-1951
    text: The block between 28th and 29th Avenues, Lawton to Moraga, was bought by the city in 1937 for 50,676 dollars and developed as a playground by the Recreation Department and the federal Works Progress Administration. It opened in 1940 with a small field house and volleyball, basketball and tennis courts. In October 1951 Mayor Elmer Robinson dedicated a much bigger recreation center with a gymnasium, auditorium, kitchen and clubrooms.

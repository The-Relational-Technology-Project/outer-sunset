    text: "Two city photos taken on January 5, 1915, look up and down 45th Avenue between Kirkham and Lawton. Sand is drifting onto the fresh pavement, and only a few houses stand among the dunes: two built in 1905 and one in 1910. A historic survey of Oceanside names the 1500 block of 45th as one of the few blocks that still has the feel of the years when Carville was turning into a regular neighborhood, with a mix of makeshift self-built cottages and full Craftsman houses."

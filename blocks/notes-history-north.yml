  - id: the-drugstore-tower-at-21st-and-irving
    title: The drugstore tower at 21st and Irving
    kind: history
    at: 21st Ave & Irving
    lat: 37.76347
    lng: -122.479266
    years: 1925-1993
    text: The building at 2001 Irving Street, on the southwest corner of 21st Avenue, went up in 1925. For decades it was Roth's Pharmacy, a Rexall store whose name and mortar and pestle were outlined in peach colored neon tubing. The building once had a corner tower, which was demolished in 1993 when it was remodeled, and it later became a bank branch. Across the avenue, Val Golding, who lived nearby in the 1930s, remembered Timel's Creamery as the place where Polytechnic High students fed dimes into the Seeburg jukebox and danced.

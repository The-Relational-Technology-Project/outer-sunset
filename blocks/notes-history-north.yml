  - id: a-gripmans-streetcar-house-on-20th-avenue
    title: A gripman's streetcar house on 20th Avenue
    kind: history
    at: 20th Ave between Judah and Kirkham
    lat: 37.760719
    lng: -122.477999
    years: "1895"
    text: Before Carville took off at the beach, Charles Stahl, a gripman on the Ellis Street cable line, tried the idea here. On a lot on today's 20th Avenue between Judah and Kirkham, then unmarked sand dunes, he joined three old North Beach and Mission horsecars that he bought for 45 dollars. He set the whole thing on stilts to keep it above the shifting sand, and his family moved in during the summer of 1895. The Examiner wrote it up as 'a habitat of street cars.'

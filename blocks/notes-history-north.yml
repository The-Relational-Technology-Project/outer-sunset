    extent: original site on Kirkham; later church at 43rd Ave & Judah
    years: 1906-1923
    text: The first permanent church in Oceanside was probably St. Paul's Presbyterian, a brown shingled building on Kirkham Street between 46th and 47th Avenues, dedicated on September 9, 1906. It soon added a gymnasium called the Oceanside Boys Club, which gave neighborhood youth a much-needed place to play. The congregation outgrew the site, and in 1923 it built a new church at the corner of 43rd Avenue and Judah Street, where it still stands. From 1924 to 1930 the local improvement clubs met at the Oceanside Community Hall at 4131 Kirkham.

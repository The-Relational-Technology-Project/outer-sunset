  - id: the-n-judah-turnaround-at-la-playa
    title: The N Judah turnaround at La Playa
    kind: history
    at: Judah & La Playa
    lat: 37.761213
    lng: -122.509205
    years: 1926-1928
    text: The streetcar loop at the west end of Judah Street was under construction in 1926, when a photo shows it surrounded by acres of sand dunes. The line it serves opened on Sunday, October 21, 1928, when Mayor James 'Sunny Jim' Rolph led a streetcar parade through the new Sunset Tunnel before crowds of thousands. The city's context statement says the tunnel gave the northern Sunset quick, direct access to downtown and had an immediate impact on building here. A 1961 photo of the terminal shows Dick's at the Beach, the Mar Motel, the Red Mill and the Sea Gull Bar.

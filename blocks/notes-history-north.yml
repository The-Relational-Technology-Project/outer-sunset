  - id: palm-trees-and-marble-entrances-on-37th-avenue
    title: Palm trees and marble entrances on 37th Avenue
    kind: history
    at: 37th Ave between Lincoln and Irving
    lat: 37.763347
    lng: -122.496459
    years: "1913"
    text: In January 1913 the Chronicle reported that the Sterling Realty Company's property on 37th Avenue between Lincoln Way and Irving was 'rapidly being transformed into a beautiful boulevard, with artistic homes on either side of a palm planted street.' Telephone poles were kept behind the lots so none would spoil the avenue. Builder L. U. Grant was finishing eighteen six-room homes there with marble entrances, hardwood floors, outdoor sleeping verandas and basement garages, and five had sold before completion. This was years before the surrounding blocks filled in.

    years: "1940"
    text: "In the first months of 1940 builder Ray Galli opened one furnished model home after another on 39th Avenue between Kirkham and Lawton: The Queen Anne at 1550 and The Carmel at 1554 in January, The Spring Haven at 1574 in February, and Casa Moderna at 1590 in March. Casa Moderna was one of the Sunset's early Streamline Moderne alternatives to traditional fronts. The Galli brothers later explained the method: people would look at a model house, then pick one under construction to buy, which they believed was new for San Francisco at the time."

    years: 1925-1964
    text: Holy Name Parish was created in 1925 for Catholics in the growing Sunset, carved out of territory that had belonged to St. Anne of the Sunset. It operated from a temporary structure for its first 16 years. A permanent church and a parish school were built at 40th Avenue and Lawton Street in 1941. By the 1960s the parish was badly overcrowded, and the present church was dedicated in 1964. According to Frank Dunnigan, it was the first Catholic church in San Francisco built to the new guidelines of the Second Vatican Council.

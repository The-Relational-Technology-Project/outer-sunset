  - id: the-trading-post-at-30th-and-judah
    title: The Trading Post at 30th and Judah
    kind: history
    at: 30th Ave & Judah
    lat: 37.76118
    lng: -122.488779
    years: "1934"
    text: A photo dated June 8, 1934, shows a bungalow at 2450 Judah Street, on the northeast corner of 30th Avenue, turned into a Depression-era shop called The Trading Post. A chalkboard listed school supplies, vitamins, magazines and soda pop, and an Old Gold cigarette sign promised 'not a cough in a carload.' A note on the back, signed May and Richard, says they opened on May 3. The lot later became a service station and then apartments. Across Judah, the 1960s apartment building on the northwest corner hides a ground-floor swimming pool, long closed and used for storage.

  - id: john-brumunds-store-at-la-playa-and-irving
    title: John Brumund's store at La Playa and Irving
    kind: history
    at: La Playa & Irving
    lat: 37.762151
    lng: -122.50927
    radius_m: 420
    extent: Lincoln Way to Irving, 48th Ave to La Playa
    years: 1898-1910s
    text: John Brumund started in 1898 with a saloon on the Great Highway, pouring drinks for weekend bicyclists. By about 1905 his store at the corner of today's La Playa and Irving Street, with Carville car-houses out front, sold groceries along with hardware, paints, oils, crockery and glass. By the 1910s it was also a real estate and rental office, the neighborhood post office and a social hall. The cluster of converted horsecars and cable cars had first formed by 1895 on the blocks just around it, between Lincoln, Irving, 48th Avenue and La Playa.

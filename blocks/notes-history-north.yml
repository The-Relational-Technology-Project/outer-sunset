  - id: sunset-boulevard-under-construction-at-kirkham
    title: Sunset Boulevard under construction at Kirkham
    kind: history
    at: Sunset Blvd & Kirkham
    lat: 37.759005
    lng: -122.495618
    radius_m: 420
    extent: Sunset Blvd from Lincoln Way south
    years: "1931"
    text: A photo taken April 2, 1931, near Kirkham Street shows Sunset Boulevard graded but unpaved, with concrete forms in place, the work crew's cars parked on the dirt, and open sand dunes on both sides. Another from May 25, 1931, shows the parkway taking shape toward Judah. The block-wide boulevard was laid out between 36th and 37th Avenues. The city's context statement dates its completion to 1931, when it gave drivers a nearly mile-long route through the dunes. In 1946 the Chronicle could still call it a lovely, peaceful parkway 'seldom used even on Sunday.'

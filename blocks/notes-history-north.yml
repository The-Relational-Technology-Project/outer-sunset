    years: 1907-1950s
    text: The little market at 1460 48th Avenue opened in 1907 and still has its worn wooden floorboards. For many years it was run by Charles and Henry Bruecker. The official name was Quality Market, but locals called it Bruecker's. In 1925 it advertised stall-fed meats, fish on Friday and two delivery runs a day, rain or shine. Neighbors kept a tab between paydays, and Jake the butcher handed bologna slices to local kids. A few doors up, Harry Rupp's butcher shop at 1446 48th was called the Oceanside Market.

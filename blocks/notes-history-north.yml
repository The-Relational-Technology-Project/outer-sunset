  - id: the-surprise-house-on-35th-avenue
    title: The Surprise House on 35th Avenue
    kind: history
    at: 35th Ave between Kirkham and Lawton
    lat: 37.758143
    lng: -122.493944
    radius_m: 420
    extent: model homes centered on 35th Ave and Kirkham
    years: "1933"
    text: In early 1933 the Rousseau brothers opened a model home called the Surprise House on 35th Avenue. It reportedly drew more than 6,000 visitors, the biggest crowd their Marian Realty Company had ever seen. The surprise was Oliver Rousseau's new Patio Plan, an open-air courtyard in the middle of the upper floor that brought light into a narrow row house. Fans later called the layout the Cadillac of the Avenue homes. The house also showed off a three-car garage and a triangular kitchen sink. Eighteen model homes around 35th and Kirkham were furnished by O'Connor Moffat and Company.

  - id: fernando-nelsons-own-house-and-parkway-terrace
    title: Fernando Nelson's own house and Parkway Terrace
    kind: history
    at: 28th Ave & Lincoln
    lat: 37.764684
    lng: -122.486877
    radius_m: 420
    extent: 27th to 32nd or 33rd Ave, Lincoln Way to Irving
    years: 1913-1916
    text: "In February 1913 the Chronicle called it the largest deal of its kind in city history: Victorian-era builder Fernando Nelson and Sons bought blocks of dunes between Lincoln Way and Irving Street for a tract named Parkway Terrace, with large detached houses on wide lots. Nelson built his own lavish home on Lincoln Way, with a rooftop pergola looking toward the ocean. City address records place it at the 28th Avenue corner. It was restored in 2015 by a Buddhist temple. Sources differ on the tract's limits: the city says 27th to 32nd Avenues, the Western Neighborhoods Project says 27th to 33rd."

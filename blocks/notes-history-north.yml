    title: A church made of streetcars
    kind: history
    at: 47th Ave between Irving and Judah
    lat: 37.761307
    lng: -122.507065
    years: 1900s-1910s
    text: St. Andrew's by the Sea, Carville's Episcopal church, stood at 1338 47th Avenue in the 1910s. It was a two-story building whose upper floor was made of old North Beach and Mission horsecars. Before it was a church the structure had been rented out under the name Vista del Mar. The Overland Monthly described it in 1908 in an article called 'A City of Cars.' That address is on 47th Avenue between Irving and Judah, in the thick of the car-house settlement. Few car houses of any kind were left by the end of the 1920s.

  - id: four-earthquake-shacks-on-kirkham
    title: Four earthquake shacks on Kirkham
    kind: history
    at: Kirkham between 47th Ave and 48th Ave
    lat: 37.758489
    lng: -122.507402
    years: 1906-2006
    text: After the 1906 earthquake the city sold off its refugee cottages, each only 14 by 18 feet, to be hauled to private lots, and several came to the wide-open Sunset. Four of them, joined together on Kirkham Street between 47th and 48th Avenues, survived until 2005, when the lot was to be developed. The Western Neighborhoods Project led a volunteer effort to save them, and a crane lifted them off the lot. One restored shack was displayed on Market Street for the 2006 centennial and then went to the San Francisco Zoo.

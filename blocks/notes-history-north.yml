  - id: the-first-beach-chalet-ended-up-on-24th-avenue
    title: The first Beach Chalet ended up on 24th Avenue
    kind: history
    at: 24th Ave between Irving and Judah
    lat: 37.762395
    lng: -122.482417
    years: 1925-1958
    text: The original Beach Chalet was an 1892 Queen Anne building on the ocean side of the Great Highway. When the current chalet was built in 1925, the old one was given to the Boy Scouts on condition that they move it. Parks Commissioner Herbert Fleishhacker paid for the move, and that spring its upper story was hauled along Irving Street to five lots on 24th Avenue between Irving and Judah. It served as the Sunset District Boy Scout Hall for 33 years. The Scouts sold it in 1958, and on May 12 of that year the vacant building burned in a three-alarm fire.

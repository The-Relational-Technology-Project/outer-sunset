    text: Photos taken on March 8, 1912, show a small transit waiting station at 41st Avenue and Lincoln Way, a lone man on a dirt road, and no entrance into Golden Gate Park where Chain of Lakes Drive now crosses. A few steps away stood the Spring Valley Water Company's water tower on 41st Avenue near Lincoln Way, which in 1915 was known as the Oceanside tank. The tower no longer exists. The Oceanside survey says a few private well houses and one water tower from those years remain on nearby blocks.

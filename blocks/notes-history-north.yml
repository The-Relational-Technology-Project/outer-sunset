  - id: the-concrete-benches-of-parkway-terrace
    title: The concrete benches of Parkway Terrace
    kind: history
    at: 31st Ave & Lincoln
    lat: 37.764541
    lng: -122.490091
    radius_m: 420
    extent: corners along Lincoln Way, 27th to 32nd Ave
    years: 1916-1918
    text: The curved concrete benches built into the corners along Lincoln Way are street furniture from Fernando Nelson's Parkway Terrace tract. A United Railroads photograph dated July 19, 1918, shows the bench at 31st Avenue and Lincoln Way standing in front of bare sand dunes, before the houses arrived. The original bench and its Parkway Terrace sign were still visible in 2025. The city's historic context statement singles out these rounded corner benches, and the deep front yards behind them, as the things that make the five-block tract notable.

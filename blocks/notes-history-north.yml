  - id: the-dynamite-factory-that-blew-up-near-22nd-avenue
    title: The dynamite factory that blew up near 22nd Avenue
    kind: history
    at: 22nd Ave between Kirkham and Lawton
    lat: 37.758758
    lng: -122.48001
    radius_m: 420
    extent: about 19th to 23rd Ave, Kirkham to Moraga
    years: 1870s-1879
    text: In the 1870s the Giant Powder Works made dynamite on about 25 fenced acres called the Treat Tract, roughly 19th to 23rd Avenues between Kirkham and Moraga. The site was chosen because nobody lived nearby. At 2 p.m. on January 15, 1879, the packing house, standing approximately at 22nd Avenue between today's Kirkham and Lawton Streets, exploded with 6,000 pounds of powder and five workers inside. Nine other buildings were destroyed and the shock was felt from the Cliff House to the waterfront. Within about a year the company had moved to the East Bay.
    tags:

  - id: rails-into-the-park-at-48th-and-lincoln
    title: Rails into the park at 48th and Lincoln
    kind: history
    at: 48th Ave & Lincoln
    lat: 37.763598
    lng: -122.508029
    years: 1913-1914
    text: A 1914 photo looking east on Lincoln Way at 48th Avenue shows laborers working on streetcar tracks that curved from Lincoln into Golden Gate Park, the route cars took to reach the beach attractions to the north. Beside the tracks stood a small depot built from parts of the former Park and Ocean Railroad depot, which had been moved here from Haight and Stanyan Streets. A year earlier the Chronicle had reported the United Railroads relaying Lincoln Way with heavy grooved rail in expectation of big crowds riding to the beach.

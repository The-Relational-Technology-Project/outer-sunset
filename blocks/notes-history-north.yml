  - id: the-heart-of-carville-on-la-playa
    title: The heart of Carville on La Playa
    kind: history
    at: La Playa between Irving and Judah
    lat: 37.761213
    lng: -122.509205
    radius_m: 420
    extent: Lincoln Way to Moraga, about 46th Ave to the Great Highway
    years: 1895-1913
    text: A photograph from about 1905 shows the block of La Playa between Irving and Judah crowded with homes and shops made from old horsecar bodies, with a three-story building in the middle and Mrs. Gunn's Home Cooking nearby. Streetcar companies sold surplus cars for as little as ten or twenty dollars. By 1901 about fifty families were said to live in roughly 100 cars, some stacked two stories high. Residents planted nasturtiums and nicknamed a big dune Mt. Diabolo. By 1908 old-timers complained that telephone lines and concrete sidewalks were ruining the place.

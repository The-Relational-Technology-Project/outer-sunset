  - id: mayor-moscone-reopens-the-n-judah-at-31st-avenue
    title: Mayor Moscone reopens the N Judah at 31st Avenue
    kind: history
    at: 31st Ave & Judah
    lat: 37.761133
    lng: -122.489853
    years: "1978"
    text: On September 16, 1978, Mayor George Moscone led the celebration at 31st Avenue and Judah Street to mark the reopening of the N Judah streetcar line after extensive renovations. A photo by Greg Gaar shows Muni's historic streetcar number 1 and the police Mounted Patrol handling the crowd. It was one of Moscone's last civic appearances in the Sunset District. Ten weeks later he was shot and killed in his City Hall office. The service station seen on the southeast corner in the photo has since been replaced by an apartment building.

    years: 1955-2005
    text: Polly Ann opened on July 16, 1955, at 39th Avenue and Noriega Street. Bernice and Chuck Lassiter bought it in 1959 and made it locally famous for unusual flavors that won ribbons at the State Fair. Charlie Wu, the owner since 1985, grew the recipe book from 250 flavors to about 500, with roughly 50 on offer at a time. The original building was torn down in 2003, and the shop survived two years by selling ice bars to grocery stores before reopening in the new building in 2005, in time for its fiftieth anniversary.

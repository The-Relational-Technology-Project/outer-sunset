    years: "1911"
    text: Jack Johnson, the first African American heavyweight boxing champion, used Ocean Beach as a base for several years. In February 1911, months after winning the 'Fight of the Century' against Jim Jeffries, he came back to San Francisco and moved into an eight-room cottage at 48th Avenue and K Street, as Kirkham was then called, with his wife Etta Duryea. It was a remote spot on the edge of Carville. Within a year he had left for Chicago. The account comes from research by Arnold Woods and Nicole Meldahl of the Western Neighborhoods Project.

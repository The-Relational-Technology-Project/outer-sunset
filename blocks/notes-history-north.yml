    title: Oceanside's downtown at 48th and Judah
    kind: history
    at: 48th Ave & Judah
    lat: 37.760337
    lng: -122.507889
    years: 1903-1907
    text: Around 1905 the residents of Carville who wanted to sound respectable called their neighborhood Oceanside, and 48th and Judah was its center. The Oceanside and Park News was published here in 1905. In 1906 or 1907 Matilda Burns, a pioneering physician and pharmacist, opened the Oceanside Pharmacy on the northwest corner. A few steps west at 4314 Judah, A. E. Harnish had opened a catchall store about 1903 selling groceries, bakery goods and beer, with wines and liquors 'for medical use' and lunches for Sunday beachgoers.

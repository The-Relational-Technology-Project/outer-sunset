    extent: block bounded by 42nd Ave, 43rd Ave, Irving and Judah
    years: 1903-1920s
    text: The first school in Oceanside started in 1903 beneath a grocery store on 48th Avenue. In 1908 a large shingled Oceanside Primary School was built on 43rd Avenue between Irving and Judah. It was demolished and rebuilt in 1913, and the name later changed to Francis Scott Key School. In the late 1910s or early 1920s a half-timbered annex, its first story clad in 12-inch redwood planks, went up at 1351 42nd Avenue, and it still stands. Across the street, Finelli's was a popular small soda fountain, since replaced by flats.

    at: 47th Ave between Judah and Kirkham
    lat: 37.759445
    lng: -122.506934
    years: 1900s-1994
    text: The three-story building on 47th Avenue began as a Carville home belonging to Robert and Ida Fitzgerald. Ida was a founder of the Falcons, the women's bicycle club that rented one of the first cars at the beach as a clubhouse. The house once had streetcars built into an upper story, but researcher James Heisterkamp learned in 1994 that a remodel had removed them. Nearby, a water tower survives on the same block, and merchant Walter Mohns built six rental cottages there between 1904 and 1915, four of which remain.

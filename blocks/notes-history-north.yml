  - id: smoking-brakes-on-the-late-night-7-line
    title: Smoking brakes on the late-night 7 line
    kind: history
    at: 41st Ave & Lincoln
    lat: 37.764069
    lng: -122.500807
    radius_m: 420
    extent: Lincoln Way from 20th Ave to the beach
    years: 1930s-1940s
    text: The Market Street Railway's 7 line ran along Lincoln Way to the beach, two blocks from the faster N Judah, so late-night cars were nearly empty. Val Golding, who lived on Kirkham Street in the 1930s, recalled that after the last full stop at 20th Avenue the motormen would notch the old wooden cars up to full speed and leave them there. To get off he would announce 'I get off at 41st' as early as Sunset Boulevard. The motorman would throw on the notoriously weak air brakes and the car would slide to a stop, wheels smoking, somewhere between 40th and 45th.

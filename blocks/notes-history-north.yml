  - id: the-patty-hearst-bank-at-22nd-and-noriega
    title: The Patty Hearst bank at 22nd and Noriega
    kind: history
    at: 22nd Ave & Noriega
    lat: 37.754099
    lng: -122.479687
    years: "1974"
    text: The Sunset branch of Hibernia Bank stood at 1450 Noriega Street, on the northeast corner of 22nd Avenue. On April 15, 1974, it was robbed by members of the Symbionese Liberation Army together with kidnapped newspaper heiress Patty Hearst, and it has been remembered as the Patty Hearst branch ever since. Columnist Frank Dunnigan also recalls a black-and-white photo mural of the whole western half of San Francisco on its lobby wall. Hibernia was absorbed by Security Pacific in 1988 and then Bank of America in 1992, which later closed the branch.

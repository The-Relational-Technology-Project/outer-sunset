  - id: the-17-line-and-why-20th-avenue-is-so-wide
    title: The 17 line and why 20th Avenue is so wide
    kind: history
    at: 20th Ave & Judah
    lat: 37.761652
    lng: -122.478065
    radius_m: 420
    extent: 20th Ave from Lincoln Way south to Wawona
    years: 1908-1945
    text: "20th Avenue from Lincoln Way to Wawona was deliberately built wider than a standard avenue because it carried the Market Street Railway's 17 streetcar line. Riders took it to Stern Grove concerts or downtown via Lincoln Way, Haight and Market. A photo from about 1937 shows 17-line car 131 on 20th Avenue at Judah. Sources differ on the start date: columnist Frank Dunnigan gives 1916 to 1945, while the city's historic context statement says the 20th Avenue line ran from 1908 to 1945."

  - id: doelgers-fancy-1932-model-homes-on-31st-avenue
    title: Doelger's fancy 1932 model homes on 31st Avenue
    kind: history
    at: 31st Ave between Lawton and Moraga
    lat: 37.75647
    lng: -122.489525
    years: "1932"
    text: In 1932, in the depths of the Depression and before his mass-production years, Henry Doelger opened fully furnished model homes on 31st Avenue between Lawton and Moraga and gave them upscale names. The Abbey and The Chatel were listed on 31st Avenue, El Cadre and Casa Alhambra on the same block, with The Windsor at 31st and Lawton. These picturesque houses are among his most individual designs. The city's context statement notes that this early tract carried no racial deed restrictions, which Doelger and other Sunset builders adopted as standard practice by the late 1930s.

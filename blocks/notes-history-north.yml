  - id: where-carville-began-47th-and-lincoln
    title: "Where Carville began: 47th and Lincoln"
    kind: history
    at: 47th Ave & Lincoln
    lat: 37.763783
    lng: -122.507238
    years: 1895-1900s
    text: The Park and Ocean steam railway ended at 47th Avenue and today's Lincoln Way, and that is where Carville took root. Colonel Charles Dailey, a Civil War veteran and friend of Adolph Sutro, lived in a former realtor's shed that he enlarged with driftwood and decorated with shells. He rented three abandoned horsecars from Sutro for five dollars a month and opened one as a coffee saloon called the Annex. A Bulletin reporter named the spot Beachside in July 1896. Later the realty firm Sol Getz and Sons ran a branch office at this corner to sell Oceanside lots.

  - id: 34th-avenue-the-one-road-through-the-dunes
    title: 34th Avenue, the one road through the dunes
    kind: history
    at: 34th Ave & Kirkham
    lat: 37.759124
    lng: -122.492937
    radius_m: 420
    extent: 34th Ave from Kirkham south to Santiago
    years: "1926"
    text: "A 1926 United States Coast Survey map shows just one north to south road crossing the sand dunes of the central Sunset: 34th Avenue. The nearest parallel through roads were 21st Avenue to the east and 45th Avenue to the west, and the map shows no east to west through roads at all in the eight blocks between Kirkham and Santiago. Much of the district simply could not be reached by car. That changed by 1931, when Sunset Boulevard opened two blocks away, though the lots beside it mostly stayed empty until the late 1930s."
    tags:

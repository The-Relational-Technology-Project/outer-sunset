    radius_m: 420
    extent: 42nd and 43rd Ave between Moraga and Noriega
    years: 1941-1942
    text: As World War II approached, Sunset builders gave their model homes patriotic or hopeful names. Henry Doelger's Rainbow House on 42nd Avenue dates to 1941, and his Freedom House on 43rd Avenue opened in 1942, both between Moraga and Noriega. They were among the last, because wartime rules soon halted nonessential building. Citywide survey figures show Sunset house construction peaking at 499 houses in 1940 and dropping sharply after 1943. Ray Galli's 1942 model on 44th Avenue was called The Challenger, and one of his 1941 models was the Priority House.

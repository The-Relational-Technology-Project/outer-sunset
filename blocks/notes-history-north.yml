  - id: the-breakers-roadhouse-and-its-hidden-plaster-sea
    title: The Breakers roadhouse and its hidden plaster sea
    kind: history
    at: La Playa between Kirkham and Lawton
    lat: 37.7577
    lng: -122.509
    years: 1904-1940
    text: "The plain stucco apartment building on La Playa, facing the Great Highway, was a roadhouse from 1904 to about 1940, known first as the Breakers, then the Crest, then Mendel's. A 1911 photo shows some 75 members of the San Francisco Motorcycle Club lined up out front. In 2013 historians Woody LaBounty and David Gallagher climbed into a crawlspace between floors and found the old ballroom ceiling: gilded plaster carp holding lamp chains in their mouths, seahorses, starfish, crabs and a turtle. The carriage house next door stabled the customers' horses."
    tags:
      - roadhouse
      - ocean-beach
      - hidden-history
      - architecture
    sources:
      - name: "The Frozen Sea: 1536 La Playa's Hidden Past, by Woody LaBounty (Western Neighborhoods Project)"
        url: https://www.outsidelands.org/breakers.php
  - id: the-last-carville-house
    title: The last Carville house
    kind: history
    at: Great Highway between Lawton and Moraga
    lat: 37.755622
    lng: -122.50879
    years: 1908-present
    text: One house made of streetcars is known to survive, on the Great Highway between Lawton and Moraga. It was built in 1908 for Minnie Collins, a notary public and photojournalist, from two cable cars and a horsecar, and the cars were probably raised to the second story in 1921. From the street it looks ordinary. Inside, visitors found original wooden benches, a slatted tongue-and-groove ceiling and a sliding horsecar door. Researcher James Heisterkamp tracked it down in 1994 after a young man with a bicycle pointed him to it. The block is also noted for its early beach cottages.
    tags:

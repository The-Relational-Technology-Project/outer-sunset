  - id: where-the-rousseau-brothers-lived
    title: Where the Rousseau brothers lived
    kind: history
    at: 36th Ave between Kirkham and Lawton
    lat: 37.758096
    lng: -122.495017
    radius_m: 420
    extent: 33rd to 36th Ave, Kirkham to Lawton
    years: 1932-1937
    text: The Rousseaus' biggest Sunset project was 93 houses on three blocks beside the newly paved Sunset Boulevard, finished in 1933. Both brothers moved in. Oliver Rousseau lived in the large Spanish Colonial Revival corner house on 36th Avenue from 1933 to 1937, and Arthur lived at the other end of the block on 36th Avenue, a storybook Tudor corner house, for the same years. Their first model homes, advertised in 1932 as the Sunset House, were on 36th Avenue. The row faces the boulevard's greenery.

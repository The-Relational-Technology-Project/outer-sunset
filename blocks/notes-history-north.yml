  - id: the-rousseau-brothers-first-sunset-block
    title: The Rousseau brothers' first Sunset block
    kind: history
    at: 33rd Ave between Kirkham and Lawton
    lat: 37.758238
    lng: -122.491802
    years: "1931"
    text: "Oliver and Arthur Rousseau, of the Marian Realty Company, finished their first Sunset District development in May 1931: 24 houses on 33rd Avenue between Kirkham and Lawton. The state Veterans Welfare Board bought the new houses on 33rd Avenue soon after and resold them on favorable terms to World War I veterans Walter J. Hilbrook and John D. Lumis. The board was busy here, and in 1937 alone it owned 52 houses in the Sunset. On the same block, Henry Doelger built the muscular Spanish Colonial Revival house on 33rd Avenue in 1935."

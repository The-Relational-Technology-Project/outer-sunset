  - id: the-surf-theatre
    title: The Surf Theatre
    kind: history
    at: Irving between 46th Ave and 47th Ave
    lat: 37.762261
    lng: -122.506595
    years: 1926-1985
    text: The theater at 4510 Irving Street opened around September 1926 as the Parkview. In 1937 it was renamed the Sunset Theatre, a second-run neighborhood house that locals called the flea house because of the sand fleas in the seats. Isabella Strohmeyer remodeled it and reopened it as the Surf on July 24, 1957, showing international films. Under Mel Novikoff it became a destination for serious moviegoers from around the Bay Area until it closed on July 7, 1985. Corabell's bar was next door. The building later became a church.

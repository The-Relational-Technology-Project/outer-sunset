    text: In November 1952 the intersection of 46th Avenue and Irving Street flooded like a pond, and a newspaper photographer caught people at the Busy Bee Market on the northwest corner watching the water rise. The corner store had started out as a Safeway grocery before becoming the Busy Bee. Today the same building, at 4499 Irving, is the Mollusk Surf Shop. Also at 46th and Irving, a private school called Rivendell later operated in a former food store until about 2000, when the building was replaced by housing.

  - id: 20th-and-noriega-when-the-sand-was-still-winning
    title: 20th and Noriega when the sand was still winning
    kind: history
    at: 20th Ave & Noriega
    lat: 37.754186
    lng: -122.477726
    years: 1924-1930s
    text: A 1924 photo looking west at 20th Avenue and Noriega shows a row of houses already built along the 1700 block of 20th Avenue, while Noriega beyond that block had not yet been cleared of sand. By the mid 1930s the southwest corner held the Sunset Central Market, run by Vic Barelich, where a clerk fetched each item for you from the shelves. Next door was Noriega Pharmacy, with a soda fountain and a slot machine. A Piggly Wiggly stood opposite, and a small early Safeway later opened up the street toward 19th Avenue.

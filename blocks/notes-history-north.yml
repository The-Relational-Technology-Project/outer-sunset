  - id: shoveling-sand-off-31st-avenue
    title: Shoveling sand off 31st Avenue
    kind: history
    at: 31st Ave between Kirkham and Lawton
    lat: 37.758333
    lng: -122.489657
    years: "1930"
    text: A city photograph taken on December 30, 1930, looks north on 31st Avenue between Kirkham and Lawton and shows the street completely blocked by drifting sand, with men clearing it by shovel. Even after streets were paved, the dunes on the empty blocks around them kept moving. Maps had once labeled this whole district the Great Sand Waste, and a citywide aerial survey as late as 1937 still showed vast areas of open dunes in the central Sunset. George Washington High School, visible in the distance today, was not yet started when the photo was taken.
    tags:

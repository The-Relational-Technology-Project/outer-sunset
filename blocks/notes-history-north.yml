  - id: shriners-hospital-and-the-street-named-for-it
    title: Shriners Hospital and the street named for it
    kind: history
    at: 19th Ave between Lawton and Moraga
    lat: 37.757046
    lng: -122.47654
    radius_m: 420
    extent: block bounded by 19th Ave, 20th Ave, Lawton and Moraga
    years: 1922-1998
    text: The brick building at 1601 19th Avenue was built in 1922 and 1923 as Shriners Hospital for Crippled Children, designed by the firm Weeks and Day. San Francisco was the third site in a national chain that treated children regardless of race, religion or ability to pay. The campus filled the block bounded by 19th, 20th, Lawton and Moraga. The hospital moved to Sacramento in 1997, and neighbors won city landmark status (number 221) for the building in 1998. It is now senior housing, and the small new street behind it is named Shriners Avenue.

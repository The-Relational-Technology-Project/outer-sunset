    extent: the east edge of the Sunset along 19th Avenue, below Golden Gate Heights
    text: The west wind did not stop at 19th Avenue. The USGS found dune sand more than 600 feet above sea level on the Sunset Heights and Grand View ridge just east of here, and photographed sand that had blown clean over a 666 foot hilltop near Moraga and Funston. On hills like these the sand piled thickest on the sheltered east side. From Ocean Beach the dunes reached about 6 miles across the city, to the old shoreline between Telegraph Hill and Rincon Hill.

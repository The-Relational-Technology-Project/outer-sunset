    years: 1980s, 2023
    text: The seawall and promenade that start at Noriega date from the 1980s; planners label it the Noriega seawall. Wind piles sand against and over it every year. In June 2023 Public Works crews moved about 30,000 cubic yards of sand at the seawall between Noriega and Santiago, pushing it back toward the ocean. The work waits each year until the snowy plovers have left the beach.

    text: Ride a bike along Lawton or Judah and you feel long swells. USGS elevation data shows Lawton dipping to about 247 feet at 30th Avenue, rising to about 278 feet at 33rd, then dropping steadily toward the beach. Judah does the same between 24th and 32nd. The USGS described the old Sunset dunes as ridges lined up across the wind, with as much as 75 feet between crest and trough. The street grid was laid over that shape, and the gentle rolls are most likely what is left of it.

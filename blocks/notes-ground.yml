  - id: a-drinking-water-well-at-west-sunset-playground
    title: A drinking water well at West Sunset Playground
    kind: geology
    at: 41st Ave & Ortega
    lat: 37.751334
    lng: -122.499914
    radius_m: 420
    extent: West Sunset Playground, 39th to 41st Avenue between Ortega and Quintara
    years: "2017"
    text: One of the city's six groundwater supply wells is at West Sunset Playground. SFPUC's San Francisco Groundwater Supply Project pumps from 120 to 460 feet down in the Westside Basin, treats the water, and blends it in small amounts with Hetch Hetchy water in the Sunset and Sutro reservoirs. Groundwater has been going into the drinking supply since April 2017, with a long-term goal of about 4 million gallons a day.

  - id: more-than-100-feet-of-sand-under-the-ortega-schools
    title: More than 100 feet of sand under the Ortega schools
    kind: geology
    at: 39th Ave & Ortega
    lat: 37.751739
    lng: -122.497793
    radius_m: 420
    extent: the school blocks on Ortega Street around 39th to 41st Avenue
    years: "1952"
    text: Before these blocks were built up in 1952, a USGS geologist measured the dunes where A.P. Giannini Middle School and its neighbor school on Ortega now stand. From the dune crests down to the troughs between them was a drop of 75 feet, and the sand itself was more than 100 feet thick. That is a ten-story building of loose, wind-sorted sand under the playground. The dunes were leveled for the schools and the houses around them, but most of that sand is still down there.
    tags:
      - dunes
      - sand depth
      - schools
    sources:
      - name: USGS Professional Paper 782, Geology of the San Francisco North Quadrangle (Schlocker, 1974)
        url: https://pubs.usgs.gov/pp/0782/report.pdf
  - id: every-block-here-sits-on-dune-sand
    title: Every block here sits on dune sand
    kind: geology
    at: 30th Ave & Noriega
    lat: 37.753721
    lng: -122.488262
    reach: everywhere
    radius_m: 420
    extent: the whole grid from 19th Avenue to the beach, Lincoln to Sloat
    text: "On the USGS geologic maps, nearly the whole Sunset is one color: Qd, dune sand. It is well-sorted fine to medium sand, mostly quartz and feldspar, and USGS reports put its thickness anywhere from 0 to about 150 feet. Under the dune sand lies the Colma Formation, an older sandy layer, and under that the Merced Formation. Solid bedrock is far below. If you dig in your yard and hit clean tan sand, you have found the top of the stack."

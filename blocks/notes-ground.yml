  - id: why-the-sunset-has-no-creeks
    title: Why the Sunset has no creeks
    kind: geology
    at: 35th Ave & Kirkham
    lat: 37.759084
    lng: -122.493831
    reach: everywhere
    radius_m: 420
    extent: the whole dune-covered grid
    text: "Other San Francisco neighborhoods have buried creeks. The Sunset mostly does not, and the USGS offers a reason: the dune sand is so porous that rain sinks in before it can gather into a stream. Its 1974 report says the high porosity of the dune sand may have kept much surface flow from ever forming. The water goes down instead of sideways, which is why the real water story here is underground."
    tags:

    years: "1906"
    text: The USGS earthquake catalog places the starting point of the great 1906 earthquake at 37.75 north, 122.55 west. That is in the ocean due west of about Ortega and Pacheco streets, a little over 2 miles off the beach. The rupture began there at 5:12 a.m. on April 18 and ran along 296 miles of the San Andreas Fault. Scientists note real uncertainty in the exact spot, but the best estimate is closer to the Sunset than to downtown.

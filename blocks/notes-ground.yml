  - id: a-water-table-that-held-steady-for-75-years
    title: A water table that held steady for 75 years
    kind: geology
    at: 44th Ave & Kirkham
    lat: 37.758653
    lng: -122.503653
    radius_m: 420
    extent: around 44th Avenue from Kirkham to Lawton
    years: 1913, 1988
    text: In 1913 an engineer named Bartell recorded the height of the water table near 44th Avenue and Kirkham Street. When USGS scientists measured a well one block farther south in 1988, the level was nearly identical. Three quarters of a century of house building, paving and pipe laying had not moved it much. The same study measured a line of shallow monitoring wells along the Great Highway between Golden Gate Park and Lake Merced.

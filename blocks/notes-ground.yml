  - id: an-old-shear-zone-under-the-reservoir-hill
    title: An old shear zone under the reservoir hill
    kind: geology
    at: 26th Ave & Ortega
    lat: 37.752356
    lng: -122.483865
    radius_m: 420
    extent: the Sunset Reservoir hill
    text: Most of the bedrock under the Sunset is hidden beneath sand, but the USGS picked up a clue at the Sunset Reservoir site. A zone of sheared Franciscan bedrock seen at Lands End shows up again here, at the south edge of the San Francisco North map. Geologists link it to the City College shear zone, which runs northwest across the city. It is one of the few places in the Sunset where geologists have had a look at how the bedrock is put together, since almost everywhere else it is buried under sand.

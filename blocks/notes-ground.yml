    extent: Ocean Beach from Sloat Boulevard south to Skyline
    years: 2015-2027
    text: South of Sloat the shore has been losing ground at an average of about 2 feet a year, and a bad winter can take 10 to 50 feet of bluff in one season, according to the Coastal Commission. The bluff here is partly dune sand, earth and rubble pushed out over the last century. Behind it is the Lake Merced Tunnel, a 14 foot wide sewer storage pipe. In 2025 SFPUC trucked about 40,000 cubic yards of sand from the north end of the beach to protect it, and a buried wall is planned to start in late 2027.

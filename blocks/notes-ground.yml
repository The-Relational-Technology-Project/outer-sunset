  - id: the-king-philip-a-clipper-ship-under-the-sand
    title: The King Philip, a clipper ship under the sand
    kind: geology
    at: Great Hwy & Ortega
    lat: 37.750969
    lng: -122.508186
    radius_m: 420
    extent: the beach between about Noriega and Pacheco
    years: 1878, 1902
    text: On January 25, 1878, the 182 foot clipper King Philip lost her anchor hold and drifted onto Ocean Beach. Her lower hull is still there, buried on the beach near the foot of Noriega and Ortega. In 1902 the schooner Reporter wrecked on the same spot, and her timbers are mixed in. The ribs have surfaced in 1982 to 1985, 2007, 2010 and 2011, usually after winter storms strip the sand at a very low tide.

    extent: the beach strip west of about 47th Avenue, Lincoln to Rivera
    text: "Loose sand sounds risky in an earthquake, but the state's official Seismic Hazard Zone maps mark only a thin strip of the Sunset for liquefaction. Checked corner by corner, the zone covers the Great Highway and reaches inland to about 47th or 48th Avenue from Lincoln Way to around Rivera. East of that, the avenues are outside it. The USGS explains why: in most places the water table in the dune sand is deep, and sand has to be waterlogged to liquefy.This is a reading of the state's map, corner by corner. For one address, check the official map."

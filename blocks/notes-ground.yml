    extent: the southwest corner of the Sunset, toward Lake Merced and the zoo
    text: Toward the hills east of 19th Avenue, bedrock comes up to the surface. Heading southwest it plunges. A USGS study that combined about 200 boreholes with more than 700 gravity readings found the bedrock surface dropping to about 2,500 feet below sea level between Lake Merced and the ocean, the deepest spot in San Francisco County. Everything above it is sand, silt and clay of the dunes, the Colma Formation and the Merced Formation.

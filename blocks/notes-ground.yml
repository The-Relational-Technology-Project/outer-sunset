  - id: the-last-moving-dunes-of-the-sunset
    title: The last moving dunes of the Sunset
    kind: geology
    at: 38th Ave & Pacheco
    lat: 37.7497
    lng: -122.4965
    reach: area
    box:
      - 37.7335
      - -122.512
      - 37.7522
      - -122.4955
    extent: west of Sunset Boulevard and south of Ortega Street
    years: 1937-1951
    text: Open, drifting dunes lasted here well into living memory. USGS geologist Julius Schlocker wrote that he saw active dunes in 1937 across the Sunset west of 33rd Avenue, and as late as 1951 in the area west of Sunset Boulevard and south of Ortega Street. They were transverse ridges, long sand waves lined up across the wind. Within a few years the last of them were graded flat for houses and schools.

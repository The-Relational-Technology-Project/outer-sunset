    title: Pine Lake, a natural lake in a sand valley
    kind: geology
    at: 33rd Ave & Wawona
    lat: 37.737959
    lng: -122.490637
    radius_m: 420
    extent: Pine Lake Park and Stern Grove, 19th to 34th Avenue south of Wawona
    text: Tucked below Wawona Street is Pine Lake, once called Laguna Puerca. It is one of only three natural freshwater lakes in the city, along with Lake Merced and Mountain Lake. The lake covers about 1.7 acres at the west end of a long, steep-sided valley that continues east as Stern Grove. Its banks are sand, and its water comes from the same aquifer that feeds Lake Merced. The USGS lists it among the natural water bodies recharged mainly by groundwater seepage.

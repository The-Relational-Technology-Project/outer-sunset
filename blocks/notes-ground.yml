    text: On March 22, 1957, at 11:44 in the morning, a magnitude 5.3 to 5.7 earthquake struck on the San Andreas just off Daly City. The worst effects were in western Daly City and the Lake Merced area at the south edge of the Sunset. One person died, about 40 were hurt, and damage came to roughly 1 million dollars, mostly cracked plaster and broken contents.

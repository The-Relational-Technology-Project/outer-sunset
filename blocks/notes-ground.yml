  - id: south-sunset-playground-has-a-well-too
    title: South Sunset Playground has a well too
    kind: geology
    at: 40th Ave & Vicente
    lat: 37.738331
    lng: -122.497929
    radius_m: 420
    extent: South Sunset Playground, around 40th Avenue between Vicente and Wawona
    years: "2017"
    text: A second neighborhood well sits at South Sunset Playground. Like its twin at West Sunset, it draws from the Westside Basin and sends water uphill by pipeline to Sunset Reservoir, where it is mixed with the regional supply. A 2017 report in the neighborhood paper said the blend flows by gravity to the Richmond, the Sunset and about 60 percent of the city's area, and that groundwater could rise to as much as 15 percent of the mix over time.

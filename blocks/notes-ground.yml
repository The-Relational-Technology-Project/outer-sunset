    text: The highest street corner in the Sunset grid west of 19th Avenue is around 20th Avenue and Quintara, about 454 feet above sea level by USGS elevation data. From there Quintara falls about 430 feet on its way to the ocean, reaching roughly 25 feet at the Great Highway. The lowest corners in the neighborhood are along the Great Highway near Irving and Judah, at about 22 feet. Lincoln Way makes the same trip more gently, from about 221 feet at 19th Avenue down to 25 feet at the beach.

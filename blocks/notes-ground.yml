    extent: the shore and seabed off the Great Highway just south of Sloat
    years: "1982"
    text: Treated water from the Oceanside plant leaves through the Southwest Ocean Outfall, which heads out to sea from the shore just south of Sloat. Engineers described it in 1982 as 23,400 feet long, crossing the San Andreas fault zone about 8,700 feet offshore. Based on 1906, they designed it for the two sides of the fault to slip 16 to 20 feet sideways, with special earthquake joints every 20 feet through the fault zone. SPUR says it releases 4.5 miles offshore in 80 feet of water.

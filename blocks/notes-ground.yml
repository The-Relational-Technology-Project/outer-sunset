    years: 1852, 1869, 1895
    text: Lake Merced is the water table showing at the surface; the USGS calls it an exposed part of the aquifer. It once had a natural outlet to the Pacific, drawn on an 1869 Coast Survey map. Accounts from November 1852 describe a night shock followed by the lake breaking through its sandbank and dropping about 30 feet, though heavy rain is the likelier cause. In 1895 an earth dam was built across the natural outlet, and a spillway now handles any overflow.

  - id: why-sunset-gardens-drain-so-fast
    title: Why Sunset gardens drain so fast
    kind: geology
    at: 42nd Ave & Moraga
    lat: 37.755007
    lng: -122.501248
    reach: everywhere
    radius_m: 420
    extent: the whole dune-covered grid
    text: USGS engineers rated the Sunset's dune sand as highly permeable, with the water table deep in most places. It is fine to medium sand, mostly quartz, feldspar and hornblende, with only a little plant matter in the top 2 to 3 feet. That is why water vanishes from a garden bed here and why compost matters so much. The same report warns that the sand runs freely in a cut and that slopes steeper than 30 degrees are generally unstable, which any neighbor who has dug a fence post hole can confirm.
    tags:
      - soil
      - gardens
      - sand
      - drainage
    sources:

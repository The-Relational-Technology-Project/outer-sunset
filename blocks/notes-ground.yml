      - -122.5
    extent: the beach bluffs from Sloat Boulevard south toward Fort Funston
    text: Under the loose dune sand is a firmer, orange-brown sandy layer called the Colma Formation. The National Park Service dates it to about 100,000 years ago, a warm period when the sea stood high. You can see it south of Sloat, where it holds up near-vertical bluffs. When crews dug the Lake Merced Tunnel under the Great Highway, the northern 1,800 feet ran through weak sand and fill before the tunnel reached the stiffer Colma.

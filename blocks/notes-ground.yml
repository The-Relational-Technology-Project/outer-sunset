    text: The California Geological Survey's tsunami hazard map, updated in 2021, draws its line a few blocks in from the beach. Checked corner by corner, the hazard area reaches about 47th Avenue from Lincoln to Pacheco, pulls back to 48th between Quintara and Taraval, and reaches 46th Avenue by Wawona and Sloat. The scenario is extreme, a magnitude 9.3 earthquake off the Aleutians. The steady upward slope of the avenues is what stops the water.This is a reading of the state's map, corner by corner. For one address, check the official map.

  - id: sunset-reservoir-two-basins-on-the-hilltop
    title: "Sunset Reservoir: two basins on the hilltop"
    kind: geology
    at: 24th Ave & Ortega
    lat: 37.752451
    lng: -122.481723
    radius_m: 420
    extent: 24th to 28th Avenue, Ortega to Quintara
    years: 1938, 1960, 2010
    text: The big flat lawn between 24th and 28th Avenues, Ortega to Quintara, is the roof of the city's largest reservoir. SFPUC lists a north basin built in 1938 holding 87 million gallons and a south basin built in 1960 holding 81.3 million gallons. The water surface sits about 380 feet above sea level, so water flows out to homes by gravity. Since December 2010 the roof has also carried about 25,000 solar panels rated at 5 megawatts.

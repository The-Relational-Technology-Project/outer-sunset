  - id: the-san-andreas-fault-runs-2-to-3-miles-off-the-beach
    title: The San Andreas Fault runs 2 to 3 miles off the beach
    kind: geology
    at: Great Hwy & Vicente
    lat: 37.738886
    lng: -122.506556
    reach: everywhere
    radius_m: 420
    extent: the whole Sunset shoreline
    text: The San Andreas Fault does not pass under the Sunset. It runs offshore. The USGS puts it 2 to 3 miles west of San Francisco, and the state fault map shows the main trace about 2 miles off Sloat Boulevard and about 3 miles off Lincoln Way. Follow it south and it comes ashore at Mussel Rock in Daly City, roughly 5 miles down the coast from Sloat. The state also counts the fault and the ocean as the west wall of the aquifer.

  - id: leaky-pipes-and-garden-hoses-refill-the-aquifer
    title: Leaky pipes and garden hoses refill the aquifer
    kind: geology
    at: 27th Ave & Irving
    lat: 37.763187
    lng: -122.485699
    reach: everywhere
    radius_m: 420
    extent: the whole Sunset
    text: "Before houses, rain was the main thing that refilled the groundwater here, about 21 inches a year at the Golden Gate Park weather station. Once the Sunset was built, the USGS found new sources: water that leaks from mains and sewers, and irrigation water that soaks past the roots in parks and backyards. On the west side the water table generally lies below the sewer lines, so leaks go down into the sand. One estimate put recharge for the whole basin at about 4,800 acre-feet a year in 1987 and 1988."
    tags:

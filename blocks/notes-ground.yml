    years: "1941"
    text: At the foot of Taraval there is a low concrete wall that the sand covers and uncovers. City planning documents call it the Taraval Seawall, built in the 1940s between Taraval and Santiago after several earlier attempts to hold the shore had failed. It is a steel sheet-pile wall with tie-backs, capped in reinforced concrete. Engineers still point to it as a model, because a wall that sits low lets a beach and dunes form on top.

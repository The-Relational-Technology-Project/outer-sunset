    years: 2021-2025
    text: Sand never stopped moving at the west edge. Before 2021 the Upper Great Highway was closed an average of 27 times a year for sand and flooding, and in April 2022 sand shut it for the entire month. Public Works named Judah as one of the hardest-hit spots. Since April 12, 2025, about 2 miles of the old roadway from Lincoln to Sloat has been Sunset Dunes park, where the drifts are part of the scenery.

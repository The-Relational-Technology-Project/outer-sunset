    years: 1980s
    text: Under the Great Highway from Lincoln to Sloat runs the Westside Transport Box, a long rectangular concrete tube built in the 1980s, when the road was cut from eight lanes to four. In a storm it stores the mix of rain and sewage from the Richmond and Sunset until the Oceanside plant by the zoo can treat it. Pumps at Sloat send the flow on. Only when everything is full does overflow go to the beach.

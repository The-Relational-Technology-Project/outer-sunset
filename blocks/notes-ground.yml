    confidence: medium
  - id: the-westside-basin-aquifer-under-every-block
    title: The Westside Basin aquifer under every block
    kind: geology
    at: 36th Ave & Rivera
    lat: 37.745979
    lng: -122.494101
    reach: everywhere
    radius_m: 420
    extent: the whole Sunset, Lincoln to Sloat and beyond
    text: Beneath the Sunset is the Westside Groundwater Basin, the largest in San Francisco. The state lists it at about 40 square miles, running from Golden Gate Park south into San Mateo County. The water sits in the pores of the dune sand, the Colma Formation and the Merced Formation, on top of watertight bedrock. Near the surface it is open to the air above; deeper than about 100 feet it is held under clay layers. SFPUC says it is filtered naturally through hundreds of feet of sand, silt and clay.
    tags:

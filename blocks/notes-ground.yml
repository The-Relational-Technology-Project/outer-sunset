  - id: your-sand-came-down-the-sacramento-river-in-the-ice-age
    title: Your sand came down the Sacramento River in the ice age
    kind: geology
    at: Great Hwy & Lawton
    lat: 37.756552
    lng: -122.508899
    reach: everywhere
    radius_m: 420
    extent: the whole Sunset dune field, beach to 19th Avenue
    text: USGS geologist Julius Schlocker traced the Sunset's sand back to a time when the sea was 228 to 406 feet lower than today. The shoreline then sat about 30 miles west of Ocean Beach, and the Sacramento and San Joaquin rivers ran out through the Golden Gate to a delta far offshore. As the ice melted and the sea rose, waves pushed that river sand east onto the beach, and the wind carried it inland. Much of the sand under the avenues started in rock far to the east.
    tags:
      - dunes
      - ice age
      - Sacramento River
      - sea level
    sources:
      - name: USGS Professional Paper 782, Geology of the San Francisco North Quadrangle (Schlocker, 1974)
        url: https://pubs.usgs.gov/pp/0782/report.pdf
  - id: the-dunes-are-only-a-few-thousand-years-old
    title: The dunes are only a few thousand years old
    kind: geology
    at: 34th Ave & Taraval
    lat: 37.742343
    lng: -122.491767
    reach: everywhere
    radius_m: 420
    extent: the whole Sunset dune field
    text: The National Park Service dates San Francisco's big dune sheet to roughly 5,000 to 8,000 years ago, when sea level steadied after the last ice age. Almost 14 square miles of the city were once covered by high, rolling dunes. The USGS map of the south half of the Sunset adds that some of the dune sand is older, reaching back into the Pleistocene. Either way, the ground under the avenues is very young by geologic standards, far younger than the rock of Twin Peaks.
    tags:

  - id: the-colma-formation-a-100-000-year-old-beach-under-your-sand
    title: The Colma Formation, a 100,000 year old beach under your sand
    kind: geology
    at: Great Hwy & Skyline Blvd
    lat: 37.7325
    lng: -122.5055
    reach: area
    box:
      - 37.726
      - -122.512

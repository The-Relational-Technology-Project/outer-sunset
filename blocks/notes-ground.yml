  - id: the-beach-grows-in-summer-and-shrinks-in-winter
    title: The beach grows in summer and shrinks in winter
    kind: geology
    at: Great Hwy & Rivera
    lat: 37.745392
    lng: -122.507442
    reach: area
    box:
      - 37.7335
      - -122.512
      - 37.765
      - -122.504
    extent: Ocean Beach, Lincoln to Sloat
    years: 1956-1957
    text: A researcher named Trask measured Ocean Beach at five stations every few weeks from July 1956 to June 1957. He found the beach built upward and seaward in summer and fall, then eroded in winter and spring, and the sand grains were coarser in the stormy months. The USGS adds that much of the beach sand comes from the soft Merced and Colma cliffs to the south, which slide and feed the shore. The beach you walk in August is not the one you walk in February.
    tags:

    kind: history
    at: Great Highway & Vicente
    lat: 37.738886
    lng: -122.506556
    years: 1927-1930s
    text: The red brick building with clay tile roof on Great Highway, on the corner of Vicente, comes with stories of a ghost, a speakeasy and a spice heir's hideaway. Historian Woody LaBounty checked. It was built in 1927, designed by an architect at a cost of more than $10,000, and opened as a family restaurant called the Chick-ery, selling 50-cent chicken dinners to the Sunday motorists who crowded Ocean Beach. Its neighbor on Great Highway, on tiny Cutler Avenue, also began as a restaurant, run by a man named Ulysses Ciati. Neither business lasted far into the Depression.

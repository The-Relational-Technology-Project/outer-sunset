    title: Roberts-at-the-Beach and the horse that swam the Golden Gate
    kind: history
    at: Great Highway between Rivera and Santiago
    lat: 37.744464
    lng: -122.507316
    years: 1901-1966
    text: Roberts-at-the-Beach stood on the Great Highway between Rivera and Santiago. It first shows up in city directories in 1901-02, run by Dominic 'Shorty' Roberts and later his son Richard, also called Shorty. It survived Prohibition, 'though no one was remembered to have gone thirsty.' In 1938, after a bet with racetrack owner Bill Kyne, the younger Shorty had his horse Blackie swim the Golden Gate on October 1 while he held the tail. The swim took 23 minutes and 15 seconds. Accounts differ on whether the bet was $1,000 or $5,000. Roberts closed in 1966 and was briefly a dance hall for teenagers.

    text: St. Ignatius, the Jesuit school founded on Market Street in 1855, moved five times before settling on its sixth campus at 2001 37th Avenue in 1969. The school had been on Stanyan Street since 1929. Father Harry Carlin led the move, and with it the high school took the name St. Ignatius College Preparatory. According to the school's history pages, classes began on September 13, 1969, with parts of the campus still unfinished, so students were let out at 1 p.m. to give workers time. The school's own history says it had finally taken root in the sand dunes of the Sunset.

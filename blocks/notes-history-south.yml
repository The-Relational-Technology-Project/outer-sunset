    text: Muni's L Taraval tracks reached 48th Avenue, a block from the beach, in January 1923. A 1925 photo shows streetcars meeting one of Muni's first bus lines here, the 2 Ocean, which ran along the Great Highway from Playland to Sloat. After 1937, when the L was rerouted down 46th Avenue to the zoo, the last two blocks of Taraval became a rarely used spur. They held the last original Muni streetcar rails in the city, still lined with granite Belgian block. The rusted rails were finally removed around 2021, 98 years after they were laid, and crews saved the blocks to set beside the new track.

  - id: the-parkside-streetcar-turned-at-20th-and-taraval
    title: The Parkside streetcar turned at 20th and Taraval
    kind: history
    at: 20th Ave & Taraval
    lat: 37.742995
    lng: -122.476942
    years: 1908-1945
    text: In June 1908 the Parkside Transit Company laid a single track down 20th Avenue from Lincoln Way to Taraval, the first rail line into the new neighborhood. Cars ran about once an hour. The franchise had been tangled in the graft scandal around political boss Abe Ruef, who was promised $30,000 by the developers. From 1916 the route became the 17 Haight and Ingleside line, which continued south to Wawona and jogged over to 19th Avenue. It ran until 1945. A 1928 photo looking north across Taraval still shows the rails in 20th Avenue, which was once the main north to south route through the Sunset.

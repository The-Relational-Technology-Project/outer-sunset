    lng: -122.481723
    radius_m: 420
    extent: about 24th to 28th Ave, Ortega to Quintara
    years: 1938-2010
    text: The city's largest reservoir hides under a flat roof at 24th Avenue and Ortega. Sources differ on its age. Wikipedia says the underground basin was completed in 1960, while the water department's dam inventory, as quoted in search results, lists a north basin from 1938 and a south basin from 1960, and the Western Neighborhoods Project has a construction photo dated 1938. Inside are 720 floor-to-ceiling columns. In 2010 a five megawatt solar plant with about 25,000 panels opened on the roof, more than tripling the city's own solar capacity at the time. Lincoln High students have long eaten lunch on its slopes.

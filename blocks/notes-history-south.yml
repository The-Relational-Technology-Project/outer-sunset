    text: Sunset Boulevard, a block-wide parkway, was finished by 1931. A city photo from September 11 of that year shows no houses along it and a large sand dune on the west side between Vicente and Wawona. In 1946 the San Francisco Soap Box Derby moved here, with boys aged nine to fifteen racing homemade coasters down the course between Ulloa and Wawona. The Chronicle called the boulevard 'a lovely, peaceful parkway drive that is seldom used even on Sunday.' The races, sponsored by the Chronicle and Chevrolet dealers, stayed until the semifinals moved out of the city in the 1960s.

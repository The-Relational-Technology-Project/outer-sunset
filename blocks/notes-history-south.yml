  - id: pine-lake-was-laguna-puerca-and-the-greenes-held-it-by-force
    title: Pine Lake was Laguna Puerca, and the Greenes held it by force
    kind: history
    at: Sloat & 34th Ave
    lat: 37.735019
    lng: -122.491575
    radius_m: 420
    extent: Pine Lake Park, north of Sloat at the west end of Stern Grove
    years: 1847-1910
    text: Pine Lake, in the gully north of Sloat, was once called Laguna Puerca. Locals also said Mud Lake or Pig Lake. The Greene family squatted here in the late 1840s and once claimed land from today's Stern Grove to the beach. They planted barley and potatoes, raised cattle, imported hogs from Australia, and set out the eucalyptus trees that still stand. Family stories tell of a metal-lined fort they built in the 1850s to fight off rival claimants. A circa 1910 real estate map marked the gully to be 'subdivided into Villa Lots later,' but that never happened. The lake's exact cross street is approximate here.

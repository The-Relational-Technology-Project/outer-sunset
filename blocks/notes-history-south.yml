  - id: the-navy-jets-of-larsen-park
    title: The Navy jets of Larsen Park
    kind: history
    at: 19th Ave & Vicente
    lat: 37.7393
    lng: -122.4755
    years: 1959-2015
    text: From 1959 to 1993 a real Navy jet sat in Larsen Park for children to climb on. The first was a Grumman F-9 Cougar, driven up from Moffett Field with a Highway Patrol escort. An FJ Fury replaced it in 1967. The third, an F-8 Crusader, was dropped by a Marine helicopter in the zoo parking lot in 1975 and hauled up Sloat Boulevard. Kids all over the Bay Area knew 'the plane park' on 19th Avenue at Vicente. The last jet left in 1993 over lead paint and repair costs and is now restored at a Santa Rosa air museum. A jet-shaped play structure opened in November 2015.

    text: The brick building at 2685 30th Avenue was built in 1928 by the San Francisco Junior League as Pinehurst, a home for children awaiting foster families. Architects Ashley, Evers and Hayes gave it three wings around a sheltered courtyard. Inside, tiles of animals, ships and castles decorate the recreation room, a fireplace frieze shows Old King Cole, and a salon was given by the Ghirardelli family in memory of their daughter Esperance. In 1929 it won a 'city clubhouses' award at an architecture exhibition at the de Young Museum. The Salvation Army has owned it since 1946.

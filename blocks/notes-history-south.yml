  - id: the-one-room-parkside-school-on-taraval
    title: The one-room Parkside School on Taraval
    kind: history
    at: Taraval between 30th Ave and 31st Ave
    lat: 37.742508
    lng: -122.488012
    years: 1909-1917
    text: The first Parkside School opened in September 1909 on land donated by the Parkside Realty Company on Taraval Street. The Parkside history statement places it near 31st Avenue; a 1910 Sunset Journal article says near 30th. It was dedicated on Sunday, September 19, 1909, with the whole neighborhood turning out and the children raising the flag. It began with first through fourth grades and added a fifth in 1910. After a bigger Parkside School was built, the old building was given to the new St. Cecilia's parish and moved to 15th Avenue and Taraval, where it served as the parish's first church.

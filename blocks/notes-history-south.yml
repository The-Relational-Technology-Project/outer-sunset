  - id: ardenwood-the-gellerts-first-full-subdivision
    title: Ardenwood, the Gellerts' first full subdivision
    kind: history
    at: Ardenwood Way & Sloat
    lat: 37.7341
    lng: -122.4772
    years: "1932"
    text: "In 1932, in the depths of the Depression, Carl and Fred Gellert's Standard Building Company built its first full subdivision on Ardenwood Way, off Sloat Boulevard: twenty-four fully detached Tudor Revival houses. They sold slowly. The brothers took the lesson and switched to plainer, faster, cheaper row houses, the model that let them and rivals like Henry Doelger cover the Sunset. So this short street of storybook houses is a picture of what the Gellerts tried before they found the formula that built some 20,000 San Francisco homes."

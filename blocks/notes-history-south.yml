    title: The Ocean House stood where Lowell High is now
    kind: history
    at: Eucalyptus Dr & Middlefield Dr
    lat: 37.7308
    lng: -122.4835
    years: 1850s-1962
    text: A roadhouse called the Ocean House stood from the 1850s near the north end of Lake Merced, in the area of today's Middlefield and Eucalyptus drives. Eucalyptus Drive follows the old Ocean House Road. The resort catered to 'sports' who came out for the racetrack across the road, and an 1870s photo shows a sign advertising its bowling alley. A Western Neighborhoods Project caption says it burned in 1882. Lowell High School, which had spent 50 years on Hayes Street, moved to this site in 1962.

    text: Taraval Police Station at 2345 24th Avenue was built in 1924, and the Parkside history statement singles it out for its brick front, unusual in a neighborhood of stucco. In later years its garage did double duty. A boys' football club called the San Francisco Mariners used the station garage as a locker room, practiced across the street in McCoppin Square and played home games on Lincoln High's field. When the club folded around 1976, the lockers were cleared out and the green and white team jackets went into Sunset District attics.

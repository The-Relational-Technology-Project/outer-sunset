    years: 1857-1940
    text: The block of the Great Highway between Ulloa and Vicente once held the Ocean Side House, a lonely roadhouse built by attorney B.S. Brooks, by legend from a wrecked steamer. One source finds ads for it in 1857; another says it opened by summer 1867. From 1901 it was the home of Alexander and Ida Russell, who hosted Zen master Soyen Shaku for nine months in 1905 and built a Japanese garden behind a high fence, which started rumors of a cult. In 1919 John Tait turned it into Tait's at the Beach, a 1920s favorite of socialites. It closed in 1931 and burned on December 1, 1940.

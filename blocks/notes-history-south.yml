    text: The L Taraval ends on a one-way loop that runs along Vicente, 47th Avenue, Wawona and 46th Avenue, with the last stop at 46th and Wawona. The loop dates from the 1937 extension to the zoo, and its original track lasted 66 years before Muni rebuilt it in 2003. The same year the streetcar arrived, the Ocean Park Motel opened at 46th and Wawona. The Western Neighborhoods Project calls it San Francisco's first motel, and it is still in business under its neon sign.

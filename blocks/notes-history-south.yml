  - id: the-ocean-course-and-the-great-race-of-1873
    title: The Ocean Course and the Great Race of 1873
    kind: history
    at: Sloat & Everglade Dr
    lat: 37.730881
    lng: -122.488894
    radius_m: 420
    extent: about Sloat to Eucalyptus Dr, 24th Ave to Everglade Dr
    years: 1865-1873
    text: From 1865 to 1873 a horse racing track called the Ocean Course covered about 100 acres leased from the Greene family, roughly between today's Eucalyptus Drive, Sloat, Everglade Drive and 24th Avenue. Its opening race on May 23, 1865, drew 8,000 people. Its last, on November 13, 1873, drew crowds estimated as high as 40,000 to watch California-bred Thad Stevens beat two Eastern champions over sixteen miles of heats, finishing by lamplight in the fog. The Parkside history statement credits the track to roadhouse keeper Cornelius Staggs. Too far from town, it held fewer than 100 racing days in eight years.

  - id: the-trocadero-inn-where-boss-ruef-was-caught
    title: The Trocadero Inn, where Boss Ruef was caught
    kind: history
    at: Sloat & 19th Ave
    lat: 37.7345
    lng: -122.4752
    radius_m: 420
    extent: inside Stern Grove, north of Sloat
    years: 1892-1916
    text: Down in the gully of Stern Grove stands the Trocadero Inn, built in 1892 for George Greene and described in the Parkside history statement as the only known building in the district older than 1905. Leased as a roadhouse, it offered a deer park, a boating pavilion and a beer garden under manager Hiram Cook. In 1907 political boss Abe Ruef, wanted in the San Francisco graft trials, was arrested while hiding here. Greene closed the inn in 1916. The exact spot is inside the park, so the nearest corner is the grove entrance at 19th and Sloat.

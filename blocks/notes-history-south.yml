    text: The grinning dachshund in a chef's hat was designed in 1966 by graphic artist Harold Bachman for the Doggie Diner drive-in chain, which Al Ross started in 1949. This head stood outside the last operating Doggie Diner, on the northeast corner of 46th Avenue and Sloat. After a grassroots campaign that was followed in the 'Zippy the Pinhead' comic strip, the city acquired it in December 2000. Wind toppled it on April 1, 2001. It was restored and, in January 2005, moved one block to the Sloat median at 45th Avenue. It is city landmark number 254.

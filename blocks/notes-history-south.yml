  - id: the-old-zoo-gate-and-the-mothers-building
    title: The old zoo gate and the Mother's Building
    kind: history
    at: 45th Ave & Sloat
    lat: 37.735653
    lng: -122.503115
    years: 1925-1970s
    text: The zoo grew out of the playground beside Fleishhacker Pool. The Mother's Building, designed by George W. Kelham and built in 1925, was a gift from Herbert and Mortimer Fleishhacker in memory of their mother Delia. It was a lounge for mothers and small children, and no boys over six were allowed inside. Animals arrived from Golden Gate Park after 1929, and the place was called Fleishhacker Zoo for decades. In the 1960s and 1970s the main entrance was a winding path down from Sloat Boulevard at 45th Avenue, past a steam locomotive and a cable car that kids could climb on, toward Storyland and the carousel.

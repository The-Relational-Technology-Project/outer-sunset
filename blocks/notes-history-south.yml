  - id: rosalie-sterns-gift-and-the-first-free-concerts
    title: Rosalie Stern's gift and the first free concerts
    kind: history
    at: Sloat & 19th Ave
    lat: 37.7345
    lng: -122.4752
    radius_m: 420
    extent: Stern Grove, along Sloat from 19th to 34th Ave
    years: 1931-1938
    text: In 1931, on the advice of parks superintendent John McLaren, Rosalie Stern bought the old Trocadero property from George Greene for $50,000 and gave it to the city in memory of her husband Sigmund, on the condition that it be used only for recreation. Stern Grove was dedicated on June 4, 1932, with children from city playgrounds dancing and the Junior Civic Symphony playing. Two Sundays later the San Francisco Symphony gave a benefit for unemployed musicians. The Midsummer Music Festival began in 1938 with a dozen free shows, and the concerts have stayed free ever since.

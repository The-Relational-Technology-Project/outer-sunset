  - id: the-first-parkside-cottages-start-at-26th-and-ulloa
    title: The first Parkside cottages start at 26th and Ulloa
    kind: history
    at: 26th Ave & Ulloa
    lat: 37.740854
    lng: -122.483062
    radius_m: 420
    extent: 26th to 32nd Ave, between Ulloa and Vicente
    years: "1908"
    text: In 1908 the Parkside Realty Company, backed by banker William H. Crocker, built its first 62 houses in a line that snaked from the corner of 26th Avenue and Ulloa southwest around a ridge of sand dunes to 32nd Avenue and Vicente. The little cottages were about 800 square feet, with two bedrooms and one bath, and buyers could pick from six facade styles. Each block between Ulloa and Vicente got a cluster of three to seven of them. A 2007 walking survey found all but one still standing, most now raised over garages. The corner cottage on 26th Avenue is one of them.
    tags:
      - parkside
      - parkside-realty
      - cottages
      - housing
    sources:
      - name: "San Francisco's Parkside District: A Historic Context Statement, 1905-1957 (Brandi and LaBounty for SF Planning, 2008)"
        url: https://archives.sfplanning.org/documents/4976-parkside-statement%20march%202008.pdf
  - id: parksides-first-club-officers-were-neighbors-on-31st-avenue
    title: Parkside's first club officers were neighbors on 31st Avenue
    kind: history
    at: 31st Ave between Ulloa and Vicente
    lat: 37.739687
    lng: -122.488352
    years: 1908-1911
    text: When the Parkside District Improvement Club formed in 1908, its secretary, Harry H. Dobbin Jr., lived in the Parkside cottage on 31st Avenue and its treasurer, Fred W. Alsing, lived a few doors down at 2583. Both houses are on the list of original 1908 cottages. In October 1911 Mrs. F.W. Alsing published 'An Ode to Parkside' in the Sunset Journal, promising that once the Twin Peaks Tunnel was finished the men would 'all go home for dinner every day at noon.' Dues were 50 cents a month, and by 1910 neighbors who had not joined were jokingly called delinquents.

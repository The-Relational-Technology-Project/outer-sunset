  - id: mccoppin-square-a-park-reserved-in-the-1860s
    title: McCoppin Square, a park reserved in the 1860s
    kind: history
    at: Taraval between 22nd Ave and 23rd Ave
    lat: 37.742885
    lng: -122.479441
    radius_m: 420
    extent: 22nd to 24th Ave, Taraval to Santiago
    years: 1869-1935
    text: McCoppin Square exists because of a deal struck long before anyone lived here. In the late 1860s Mayor Frank McCoppin offered squatters on the Outside Lands clear title if they gave up ten percent of their land and paid a tax for parks. The arrangement, approved in 1869, set aside Golden Gate Park and several neighborhood squares, this one among them. It may be the oldest public park on the west side. Federal relief crews improved the ballfield in 1934, and a 1935 dedication drew a parade from West Portal School and an estimated 10,000 people. Old real estate maps had shown plans to subdivide it, but that never happened.
    tags:

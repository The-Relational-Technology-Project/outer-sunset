    lng: -122.477608
    radius_m: 420
    extent: 19th to 26th Ave, Sloat to Eucalyptus Dr
    years: 1930s-1940s
    text: The blocks south of Sloat between 19th and 26th avenues were developed from the early 1930s to the early 1940s as Merced Manor, by builders including Fernando Nelson, George Elkington and Arthur Herzig. According to Wikipedia's account, it was marketed as 'The White City' for the color of its houses. Unlike most Sunset rows, the houses are detached, with garages in back reached from shared alleys. Nelson kept the numbered avenues here, where the Gellerts next door switched to names. Herzig, who started on 21st Avenue, lived in the large house at 20th and Sloat. The Merced Manor reservoir sits on Sloat between 22nd and 23rd avenues.

    text: Builder Chris McKeon started as a carpenter in 1927. In 1936 he laid out a tract he called Rivera Heights, centered on 29th Avenue at Rivera Street, and put up dozens of houses. He lived for a short time on 29th Avenue, apparently just for the year he oversaw building and sales, and ran his office from 30th Avenue. City planners who reviewed sample deeds found that Rivera Heights carried no racial restrictions, unlike many late 1930s tracts. McKeon went on to run the Happy Homes Building Company from offices on Taraval.

  - id: carl-larsens-gift-at-19th-and-ulloa
    title: Carl Larsen's gift at 19th and Ulloa
    kind: history
    at: 19th Ave & Ulloa
    lat: 37.742114
    lng: -122.475664
    radius_m: 420
    extent: 19th to 20th Ave, Ulloa to Wawona
    years: 1926-1931
    text: Carl Larsen came from Denmark, ran the Tivoli Cafe downtown and kept a chicken ranch in the Sunset dunes to supply it with eggs. By 1910 he owned fourteen full blocks out here. In 1926 he gave the city two blocks between 19th and 20th avenues, from Ulloa to Wawona, and Mayor 'Sunny Jim' Rolph thanked him on the steps of City Hall. The park opened in 1927. A boulder at the 19th and Ulloa corner carries a bronze plaque with Larsen's bust by sculptor M. Earl Cummings. Larsen died in 1928, and a handwritten will leaving most of his estate to the city was thrown out in court.

  - id: the-foundation-that-sat-for-seven-years-at-21st-and-ulloa
    title: The foundation that sat for seven years at 21st and Ulloa
    kind: history
    at: 21st Ave & Ulloa
    lat: 37.741091
    lng: -122.477704
    years: 1940s
    text: During World War II the Parkside District Improvement Club caught Doelger Brothers, the biggest home builders in the Sunset, putting up what the club considered substandard housing at the corner of Ulloa Street and 21st Avenue. The club stopped the job in mid-construction. According to the Parkside history statement, the foundation of the unfinished building then sat undisturbed for seven years. By the 1950s the club was known for fighting what members called 'cracker jack' housing, extra gas stations and a proposed Western Freeway.

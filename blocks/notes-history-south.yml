    text: In 1939 the Gellert brothers' Standard Building Company invented a brand name, Sunstream Homes, for row houses priced under $6,000. The name joined 'sun,' for the Sunset, with 'streamline.' More than 100 billboards went up on corners around the district, and the homes even featured in a local radio drama. According to the city's history of Sunset builders, the very first block of Sunstream Homes was built on 31st Avenue between Quintara and Rivera. Early model homes were named for the nearest street, such as the Sunstream Rivera. Sales rose 45 percent within a year.

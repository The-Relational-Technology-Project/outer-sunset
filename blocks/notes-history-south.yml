  - id: charlie-savas-pool-at-19th-and-wawona
    title: Charlie Sava's pool at 19th and Wawona
    kind: history
    at: 19th Ave & Wawona
    lat: 37.7374
    lng: -122.4754
    years: 1950s-2008
    text: The indoor pool at the south end of Larsen Park was first called Larsen Pool. It was renamed for Charlie Sava, the swimming coach who trained Olympic champion Ann Curtis and, by one account, taught some 50,000 city school kids. The old pool was razed in 2007 and a new Charlie Sava Pool opened on the same site in December 2008 at a cost of about $17 million, with eight 25-yard lanes and big windows facing Wawona Street. Historian Woody LaBounty noted dryly that the new neighborhood pool took over a decade to get built, while giant Fleishhacker Pool went up in three years.

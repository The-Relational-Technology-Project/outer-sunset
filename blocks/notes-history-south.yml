  - id: the-williams-store-parksides-first-grocery-and-town-hall
    title: The Williams store, Parkside's first grocery and town hall
    kind: history
    at: 32nd Ave & Taraval
    lat: 37.742437
    lng: -122.48962
    years: 1908-1920s
    text: Eugene Williams opened the first store in the Parkside at 2201 Taraval, on the southwest corner of 32nd Avenue. The Parkside history statement dates the building to 1908; another account by the same historian says the grocery opened in 1909. Upstairs was 'Williams Hall,' where neighbors held dances, costume parties, talent shows, suffrage talks and improvement club meetings into the 1920s. Boys out hunting brush rabbits in the dunes would stop here around noon, pool a nickel for a loaf of raisin bread, and pick up the Williams family's three dogs for the afternoon. The remodeled building survives as Gene's Liquors.

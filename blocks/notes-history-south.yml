    lat: 37.735383
    lng: -122.505976
    years: 1925-1981
    text: The 'world's largest swimming tank' opened on April 23, 1925, on land south of Sloat that the city bought from the Spring Valley Water Company in 1922. Fleishhacker Pool was 1,000 feet long and 150 feet wide, held six million gallons of pumped seawater, and needed twelve to twenty-four lifeguards, some in rowboats. Almost 60,000 people swam in its first two months, and Olympian Ann Curtis set records here. A January 1971 storm damaged the ocean pipe and the pool closed. Voters declined to pay for repairs in 1977, and it was filled in starting in 1981. The site became the zoo parking lot.

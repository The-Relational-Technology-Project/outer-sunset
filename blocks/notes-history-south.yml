  - id: the-longest-streetcar-line-in-the-city-ran-down-sloat
    title: The longest streetcar line in the city ran down Sloat
    kind: history
    at: 35th Ave & Sloat
    lat: 37.734636
    lng: -122.492323
    radius_m: 420
    extent: Sloat Blvd from 19th Ave to the Great Highway
    years: 1909-1945
    text: From 1909 to 1945 the 12 line streetcar ran in the middle of extra-wide Sloat Boulevard on its way from the Ferry Building to Ocean Beach. The Parkside history statement calls it the longest line in the city. At 35th Avenue it met the little Parkside 'Dinky' car that came down from Taraval. On Sundays between 1916 and 1937, cars from the 20th Avenue line also came down 19th Avenue and turned west on Sloat to the beach. The 1910 census found a construction camp of street workers living along Sloat. Buses replaced the streetcars after 1945.

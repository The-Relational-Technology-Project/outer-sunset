  - id: pinelake-park-mayor-rolph-turns-the-first-spade
    title: "Pinelake Park: Mayor Rolph turns the first spade"
    kind: history
    at: Sloat & 34th Ave
    lat: 37.735019
    lng: -122.491575
    years: 1927-1940
    text: On April 2, 1927, Mayor James Rolph turned a ceremonial first spade of earth near 34th Avenue and Sloat for Pinelake Park, the Parkside Realty Company's last big project. Plans called for 500 houses, underground utilities, a curving Crestlake Drive and a commercial center on 35th Avenue with shops, a bank and a movie theater. The company built only ten to fifteen houses near Sloat and 34th, plus a few larger ones above the lake, including Spanish Colonial Revivals on Crestlake Drive. The Depression stalled the rest. In 1939 and 1940 the Gellert brothers' Standard Building Company filled in more than 240 houses.

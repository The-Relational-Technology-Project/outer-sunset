    title: Mayor Rossi drives the first streetcar around the corner
    kind: history
    at: 46th Ave & Taraval
    lat: 37.741767
    lng: -122.504621
    years: "1937"
    text: On September 15, 1937, after five years of lobbying by neighbors, the L Taraval was extended to turn south at 46th Avenue and run to Fleishhacker Playground, today's zoo. Mayor Angelo Rossi acted as motorman on the first car, with Parkside leaders Ray Schiller, Ed Haughy and Mabel Powell aboard. The rails were not new. They were recycled from old tracks on Gough Street and on 10th Avenue in the Richmond, and the WPA supplied the labor, so the nine-tenths of a mile cost city taxpayers nothing. A photo taken that day looking south from Taraval shows very few houses.

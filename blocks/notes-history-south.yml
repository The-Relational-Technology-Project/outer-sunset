  - id: the-parkside-dinky-turned-south-at-33rd-avenue
    title: The Parkside 'Dinky' turned south at 33rd Avenue
    kind: history
    at: 33rd Ave & Taraval
    lat: 37.74239
    lng: -122.490692
    radius_m: 420
    extent: Taraval from 20th to 33rd Ave, then 33rd, Vicente and 35th Ave to Sloat
    years: 1910-1927
    text: From 1910 to 1927 a strictly local streetcar nicknamed the Dinky ran from 20th and Taraval west to 33rd Avenue, then south on 33rd, over on Vicente, and down 35th Avenue to Sloat Boulevard. It linked Parkside residents to the 20th Avenue cars and the Sloat line. When Muni's L Taraval arrived, it shared these tracks between 20th and 33rd; the L reached 33rd Avenue in April 1919. A 1923 photo at 33rd and Taraval shows the Parkside sales office standing nearly alone, and a transit historian reads that as a sign the old private line had limited success in selling lots.

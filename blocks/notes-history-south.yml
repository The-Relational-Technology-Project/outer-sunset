  - id: the-finest-branch-library-in-the-country-at-22nd-and-taraval
    title: The 'finest branch library in the country' at 22nd and Taraval
    kind: history
    at: 22nd Ave & Taraval
    lat: 37.742909
    lng: -122.478905
    years: "1951"
    text: The Parkside Branch Library opened in 1951 on the Taraval edge of McCoppin Square. Architects Appleton and Wolfard gave it an open plan with a copper-hooded fireplace, a cork floor, radiant heat, Eames furniture and a patio landscaped by Lawrence Halprin. The Chronicle called it the 'finest branch library in the country,' and a trade magazine said its turquoise and yellow colors gave it the look of 'a refined night club.' It replaced a rented storefront library at 1541 Taraval, and attendance doubled. The firm went on to design seven more city branches on the same pattern.

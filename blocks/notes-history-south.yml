  - id: a-volunteer-firehouse-with-a-100-pound-brass-bell
    title: A volunteer firehouse with a 100-pound brass bell
    kind: history
    at: 28th Ave & Ulloa
    lat: 37.740759
    lng: -122.485205
    years: 1908-1915
    text: With the nearest fire station more than a mile away over poor roads and only three hydrants in the whole district, early Parkside residents formed their own volunteer brigade of 25 men. The Parkside Realty Company donated a firehouse, a carriage and a hose reel. City fire commissioners gave hoses, axes, hooks and ladders, and the improvement club supplied lanterns and a 100-pound brass alarm bell. The little firehouse stood near the northeast corner of 28th Avenue and Ulloa Street. It is long gone, but a photo from about 1915 shows it on 28th Avenue near Ulloa.
    tags:

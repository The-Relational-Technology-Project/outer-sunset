  - id: hiram-cooks-roadhouse-at-22nd-and-vicente
    title: Hiram Cook's roadhouse at 22nd and Vicente
    kind: history
    at: 22nd Ave & Vicente
    lat: 37.739182
    lng: -122.478643
    years: 1910-1915
    text: Hiram Cook, who had managed the Trocadero Inn for the Greene family, opened his own 'Family Grill' in 1910. The 1915 Sanborn fire insurance map labels it 'Hiram Cook's Road House' at 22nd Avenue and Vicente Street, with a bar, a dance hall and a dining room. The 1914-1915 city directory gives a different address, on 19th Avenue between Vicente and Wawona, so the sources do not quite agree on the spot. Either way, it was one of only two roadhouses that ever operated inside the Parkside proper, at a time when barely 200 buildings stood in the whole district.

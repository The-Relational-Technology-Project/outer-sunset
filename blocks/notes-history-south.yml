    extent: 28th to 30th Ave, south of Vicente
    years: 1923-1944
    text: In 1923 the San Francisco Protestant Orphanage, founded in 1851, bought ten acres along Vicente Street between 28th and 30th avenues. Architects Bliss and Faville designed a campus that opened in 1924, with an administration building and its double staircase facing Vicente at 29th Avenue, and six cottages behind. Each cottage housed twenty children with two cottage 'mothers.' The kids went to Parkside School and called themselves 'P.O. kids.' By 1944 only about six percent were true orphans, and the name was changed to Edgewood. It still serves children and families behind its pines and cypresses.

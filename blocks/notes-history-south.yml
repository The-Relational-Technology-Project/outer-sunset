  - id: a-candlelit-first-meeting-at-26th-and-taraval
    title: A candlelit first meeting at 26th and Taraval
    kind: history
    at: 26th Ave & Taraval
    lat: 37.74272
    lng: -122.483192
    years: "1908"
    text: The first meeting of the Parkside District Improvement Club took place in early autumn 1908 in the bare sales office of the Parkside Realty Company at 26th Avenue and T Street, now Taraval. Pioneer resident H.H. Dobbin Sr. remembered that the only light came from candles stuck in the rafters, and the men had to shield the flames with their hats against wind blowing through broken windows and a door that would not close. Within a month the club had won the district a few streetlights. It went on to push for a school, mail delivery, a firehouse and better streetcars.
    tags:

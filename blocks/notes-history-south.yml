    years: 1908-1930s
    text: The line of 1908 Parkside cottages ended at 32nd Avenue and Vicente Street. A photo from about 1915 looks northeast toward this corner and shows the little houses beside high bare sand dunes. One of them later held the Parkside's first circulating library, started privately in the 1930s by Evelyn LaPlace. She went on to run shops on Taraval, serve as president of the Parkside District Improvement Club and sit on the city Library Commission. The cottages along here are among the ones the 2008 history statement urged the city to survey and protect.

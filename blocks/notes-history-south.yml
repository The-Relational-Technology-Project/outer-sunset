    text: The blocks around 32nd Avenue and Rivera were built up in the 1930s by the Golden Gate Investment Company, which sometimes hired architects. In 1938 the firm put up a cluster of five Streamline Moderne houses on 32nd Avenue at Quintara, one of only a handful of such groupings in the Sunset. A block away, at Rivera Street and 33rd Avenue, the Castle Building Company built four split-level houses around 1931, designed by architect Donnell Jaekle. The city's builder history calls them the earliest known split-level group in the district. The firm also built two unusual Art Deco houses on 33rd Avenue.

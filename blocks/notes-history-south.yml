  - id: the-parkside-theatre-at-19th-and-taraval
    title: The Parkside Theatre at 19th and Taraval
    kind: history
    at: 19th Ave & Taraval
    lat: 37.743052
    lng: -122.475657
    years: 1928-1988
    text: The Parkside Theatre opened on December 28, 1928, at 933 Taraval, just west of 19th Avenue. An early patron remembered sand dunes on both sides and walking home with the shine scuffed off her new patent-leather shoes. For about thirty years its marquee anchored the Taraval shopping strip. In 1965 it was remodeled as the Fox Parkside for reserved-seat road shows. It closed in 1976, then reopened with a preschool on the ground floor and evening movies watched from the balcony above the toys. The movies ended for good in July 1988, and the upper floors became condominiums.

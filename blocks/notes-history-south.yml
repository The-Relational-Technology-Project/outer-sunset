    extent: 22nd to 24th Ave, Quintara to Santiago
    years: 1927-1940
    text: Abraham Lincoln High School, the only public high school ever built in the Sunset, sits on four blocks bounded by 24th Avenue, Quintara, 22nd Avenue and Santiago. Parkside neighbors began asking for it in 1927, when local teens had to pay two streetcar fares to reach school. Voters passed a bond in 1938 and Mayor Angelo Rossi dedicated the building on September 22, 1940. Timothy Pflueger was one of its three architects. 'Temporary' classroom bungalows then stayed in the yard for more than 50 years. The school says its mustang mascot recalls a horse farm that once operated nearby. Alumni include Vince Guaraldi and Barbara Eden.

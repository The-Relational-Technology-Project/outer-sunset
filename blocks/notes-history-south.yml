  - id: lakeshore-park-farmland-to-a-house-a-day
    title: "Lakeshore Park: farmland to a house a day"
    kind: history
    at: Forest View Dr & Sloat
    lat: 37.731717
    lng: -122.48359
    radius_m: 420
    extent: Sloat to Lake Merced Blvd, Inverness Dr to Sunset Blvd
    years: 1939-1950s
    text: "South of Sloat was farmland leased to Italian vegetable growers until 1939, when Carl and Fred Gellert bought it from the Spring Valley Water Company for a 'de luxe subdivision' called Lakeshore Park. Instead of numbered avenues they chose leafy names: Sylvan, Middlefield, Forest View, Riverton, Springfield. The first model home was on Forest View Drive, and 'The Commodore Sloat' opened on Sloat in August 1941. Crews then built more than 200 houses in five months. Every deed barred non-white residents, a practice the Supreme Court made unenforceable in 1948. After the war came split-levels, and in the early 1950s the Lakeshore Plaza shopping center on the west side."

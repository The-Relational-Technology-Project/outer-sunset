  # Karaoke. Nights and times come from each place's own calendar, read on the date given. They move, so the calendar is the last word.
  - name: The Riptide
    address: 3639 Taraval St near 47th Ave
    what: neighborhood bar with live music and no cover. Its own calendar lists karaoke every Tuesday, 8:30 to 11:30 pm ("Eileen's Punk Rock and Schlock Karaoke"), read Nov 17, 2026. The start time has moved during the year, so check the calendar. The only public karaoke night confirmed in the Outer Sunset.
    url: https://www.riptidesf.com/
    hours: Mon-Sat 3 PM - 2 AM, Sun 1 PM - 12 AM
    hours_source: https://www.riptidesf.com/
    last_verified: 2026-11-17
    tags: [karaoke, bar, live music, singing, night out]

  - name: South Sunset Senior Center (Self-Help for the Elderly)

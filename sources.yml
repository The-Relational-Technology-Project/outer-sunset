      station: "9414290"

  - id: open-meteo-marine
    name: Open-Meteo marine
    about: Ocean temperature and waves off Ocean Beach.
    url: https://open-meteo.com/en/docs/marine-weather-api
    type: api
    adapter: open-meteo-marine
    refresh: 1h
    license: CC BY 4.0, free for non-commercial use. Model estimate, not a buoy.
    status: live
    vital_sign: true
    config:
      latitude: 37.753
      longitude: -122.51

  - id: open-meteo-air
    name: Open-Meteo air quality
    about: Air quality in the Outer Sunset.
    url: https://open-meteo.com/en/docs/air-quality-api
    type: api
    adapter: open-meteo-air
    refresh: 1h
    license: CC BY 4.0, free for non-commercial use. CAMS model data.
    status: live
    vital_sign: true
    config:
      latitude: 37.753
      longitude: -122.505

  - id: sfpuc-beach-water
    name: SFPUC beach water quality
    url: https://sfpuc.org/programs/ocean-and-beach-monitoring
    type: page
    refresh: 24h
    license: No public feed found. Results are on a map and a hotline (415-242-2214). The agent links the page and the hotline.
    status: excluded
    vital_sign: true

  - id: plover-season
    name: GGNRA snowy plover protection season
    about: Whether the snowy plovers' protection season is on, and what it asks of dog walkers.
    url: https://www.nps.gov/goga/planyourvisit/oceanbeach.htm
    type: repo-file
    adapter: plover-season
    refresh: 24h
    license: Dates come from Knowy's notes on the plovers, which cite the NPS Ocean Beach page.
    status: live
    vital_sign: true

  - id: nps-alerts
    name: NPS alerts for Golden Gate
    about: Park alerts from Golden Gate National Recreation Area, like beach fire rules and closures.
    url: https://www.nps.gov/goga/planyourvisit/conditions.htm
    type: api
    adapter: nps-alerts
    refresh: 6h
    # Stewards: set NPS_API_KEY for more than light use; DEMO_KEY works otherwise.
    license: US government data.
    status: live
    vital_sign: true
    config:
      park_code: goga
      key_env: NPS_API_KEY

  - id: inaturalist
    name: iNaturalist
    about: Wildlife and plants neighbors have spotted and logged nearby.
    url: https://www.inaturalist.org/observations?nelat=37.78&nelng=-122.47&swlat=37.72&swlng=-122.52
    type: api
    adapter: inaturalist
    refresh: 6h
    license: Observations are licensed by their observers, mostly CC BY-NC. The agent shows common name, date, place, and the observation link. No photos cached.
    status: live
    vital_sign: true
    config:
      nelat: 37.78
      nelng: -122.47
      swlat: 37.72
      swlng: -122.52
      per_page: 30

  - id: airnow
    name: AirNow
    about: Official air quality readings.
    url: https://www.airnow.gov/
    type: api
    refresh: 1h
    license: Needs an API key. Open-Meteo covers air quality for now.
    status: planned


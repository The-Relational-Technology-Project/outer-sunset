# Sunset neighbors' picks: places and services neighbors spoke well of in a long-running neighborhood group chat.
# Places, not people. No names of who said what, no quotes, no phone numbers, no individuals.
# The chat itself is not here and is not kept. Edit by PR: add a +1 (raise vouches, extend when), or remove one that's gone downhill.

meta:
  title: Sunset neighbors' picks
  from: A long-running Sunset neighbors' group chat, about 1,700 messages from late May to mid-November 2026
  as_of: '2026-11-11'
  added: '2026-11-12'
  how_to_read: 'vouches is how many different neighbors spoke well of it; when is when, so you can judge freshness. Most
    have one or two vouches: read them as a name that came up when a neighbor asked, not a ranking.'
  caveat: These are neighbors' experiences, not vetted endorsements. Only places and services with a shop, a website, or
    a public page are here, and only when someone spoke well of them. For big jobs, get several quotes.
  privacy: Places, not people. No one who recommended or commented is named or quoted. No individuals, no phone numbers,
    no addresses. Each line is written fresh in plain words.
  how_to_reach: 'The chat is full and can''t be joined, so don''t send anyone there. For the details behind a pick, ask
    a neighbor: Knowy can pass a question along to someone who offered to be asked, or to the stewards.'
  highlights:
  - 'The names that came up most: Tuesday Tattoo on Noriega (4), Avenues Pet Hospital (3), Sams Clinic for dogs'' joints
    (3), Rose Gold''s (3), and three bars for watching a game: Flanahan''s, Underdogs and Sunset Cantina (3 each).'
  - 'What neighbors asked for most were everyday services close to home: a vet, a dentist, a haircut, a mechanic, someone
    for the garden, a cafe to work from.'

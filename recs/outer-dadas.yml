# Outer Dadas Recs: recommendations from the Outer Dadas group chat, as of Aug 4, 2026.
# One entry per rec. Edit by PR: add a +1 (raise vouches, update when), add a rec, or flag one that's gone downhill.
# Personal phone numbers stay out unless the person said yes. See privacy below.

meta:
  title: Outer Dadas Recs
  from: The Outer Dadas group chat (dads in the Outer Sunset), about 4,900 messages from June 2025 through July
    2026, cross-checked against the group's earlier knowledge base
  as_of: '2026-08-04'
  added: '2026-11-06'
  how_to_read: vouches is how many different dads vouched for it (their own good experience, a +1, or a seconded);
    when is when, so you can judge freshness
  caveat: These are neighbors' experiences, not vetted endorsements. Only things dads spoke well of are included.
    For big jobs, get multiple quotes.
  privacy: No recommender is named. Individuals who are reached only by a personal phone or email are listed by
    first name and trade without the number; ask in Outer Dadas for it. Add a number here only with that person's
    yes.
  how_to_reach: For a contact that isn't listed, ask in the Outer Dadas chat; the recommender usually pipes up.
    Not in the group? Ask a steward (STEWARDS.md).
  highlights:
  - The most unanimous rec in group history is Sonic internet — two separate threads (Nov '25 and Apr '26) drew
    15+ dads saying some version of "best ISP I've ever had." Nothing else comes close.
  - 'The group''s other favorites, by pile-on: the Specialized Globe Haul cargo e-bike ( ×7), Golden Gate Pediatrics
    ( ×6), SF Bay Pediatrics ( ×5), SF Tots soccer ( ×5), The New Wheel bike shop ( ×5), Mark''s $35 mobile car
    detailing ( ×5), Tiny Tots diaper service ( ×4), Amy Clark lactation support ( ×4), Music Together classes (
    ×4), Two Pitchers Brewing ( ×4), and Natural Resources'' parenting classes ( ×4).'
  - The most trusted tradespeople are individuals, not companies. Many of the strongest recs are one person and
    a phone number — Meir the plumber, Ronan the electrician, Marcio the painter, José the gardener. That's the
    real value of a neighborhood network.
  - Cargo e-bikes are the group's signature purchase. Three separate threads, more than a dozen owners, and multiple
    dads describing their bike as a car replacement.
  - 'Recurring themes: Kaiser-covered doulas, forest and outdoor preschools, get-three-quotes culture for home projects,
    and a strong preference for keeping money in the neighborhood.'

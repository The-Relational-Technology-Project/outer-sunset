# Public points of contact neighbors have agreed to be listed as.
#
# Rule: a person goes here only with their yes, for this purpose. Until then, list the org and its
# public contact page, not a person. The agent can point to anything here; it refuses to say where
# any individual lives.
#
# Fields: name, org, role, reach (a public url or address they chose), topics (what to send them), listed (date), consent (how)

people:
  - name: Josh Nesbit
    org: Relational Tech Project
    role: first steward of this agent
    reach: josh@relationaltechproject.org
    topics: [stewarding, the agent itself, outersunset.today, build days]
    listed: 2026-11-06
    consent: wrote the spec

orgs:
  - name: Sunset Social Club
    role: a free neighborhood club run by people who live in the Sunset; gatherings, workshops, tea, tai chi, and the Sunset Wave. Write to oursunsetsocialclub@gmail.com or use the contact page.
    reach: https://sunsetsocialclub.org/contact
    topics: [meeting people, joining something, hosting a gathering, ideas for a gathering, sponsoring an event, the Sunset Wave]
    source: https://sunsetsocialclub.org

  - name: The Sunset Wave
    role: neighbor gatherings on every block on Saturday, March 20, 2027, organized by the Sunset Social Club; Sandi Lam Harder and Josh Nesbit are its stewards
    reach: oursunsetsocialclub@gmail.com
    topics: [hosting a gathering on your block, block parties, co-hosting, street closure permits, help with hosting costs, sponsoring or donating, press about the Wave]
    source: https://thesunsetwave.org/contact

  - name: Surfrider Foundation San Francisco
    role: beach cleanups, ocean advocacy
    reach: https://sf.surfrider.org/
    topics: [beach cleanups, the ocean, water quality]
    source: https://outersunset.us

  - name: Far Out West Community Garden
    role: community garden, film nights, neighbor coffee
    reach: https://faroutwestcommunity.org/
    topics: [gardening, outdoor film, volunteering]
    source: https://outersunset.us

  - name: Sunset Dunes parkrun
    role: free weekly 5k, Saturdays 8am
    reach: https://www.parkrun.us/sunsetdunes/
    topics: [running, walking, Saturday mornings]
    source: https://outersunset.us

  - name: Community Supplies
    role: the Sunset and Richmond sharing community
    reach: https://communitysupplies.org
    topics: [borrowing tools, lending things, a tool library]
    source: https://communitysupplies.org

  - name: Sunset Board
    role: flyers found on poles and boards, logged
    reach: https://sunsetboard.org/add
    topics: [posting a flyer, classes, kids, music]
    source: https://sunsetboard.org

  - name: SF Recreation and Parks
    role: runs Sunset Dunes; permits for events there
    reach: https://sfrecpark.org/
    topics: [events in Sunset Dunes, permits]
    source: constituents/dunes.md

  - name: San Francisco Animal Care and Control
    role: coyotes, lost pets
    reach: "415-554-6364"
    topics: [coyotes, an aggressive animal, a lost dog]
    source: constituents/coyotes.md

  # Who checks on people. Each is the group's own public line, read Nov 17, 2026.
  - name: Self-Help for the Elderly, South Sunset Senior Center and Chi Sing Community Center
    role: senior centers with daily meals, classes, and services in Cantonese; South Sunset is at 2601 40th Ave; Chi Sing is at 3133 Taraval St (415-369-2210)
    reach: "628-278-7277"
    topics: [older neighbors, senior meals, services in Cantonese, classes for seniors, help reading a letter or bill]
    source: https://www.selfhelpelderly.org/locations

  - name: DAS Benefits and Resource Hub
    role: the city's front door for services for older adults and adults with disabilities
    reach: "415-355-6700"
    topics: [help for an older neighbor, disability services, home care, caregiver support, senior meals]
    source: https://www.sfhsa.org/services/disability-aging

  - name: Institute on Aging Friendship Line
    role: free 24-hour support line for people 60 and over, adults with disabilities, and caregivers; makes check-in calls on request; Cantonese and Mandarin 888-670-2504, Russian 888-560-7360, Spanish 888-571-0411
    reach: "888-670-1360"
    topics: [loneliness, an older neighbor who lives alone, someone to talk to, regular check-in calls]
    source: https://www.ioaging.org/services/friendship-line/

  - name: San Francisco Village
    role: membership group for older San Franciscans; has a Sunset neighborhood circle for 94116 and 94122
    reach: "415-387-1375"
    topics: [aging at home, meeting other older neighbors, neighborhood circles, volunteering with older adults]
    source: https://www.sfvillage.org/neighborhood-circles/

  - name: Community Living Campaign
    role: Community Connectors groups and Neighborhood Buddies, trained volunteers who make weekly friendly check-ins by phone, video, or in person
    reach: "415-821-1003"
    topics: [checking on a neighbor, friendly visits, tech help for seniors, grocery delivery volunteers]
    source: https://sfcommunityliving.org/programs/neighborhood-networks/

  - name: Little Brothers Friends of the Elderly San Francisco
    role: no-cost visits and celebrations for isolated older adults; takes referrals and volunteers, including Thanksgiving visits and meal deliveries
    reach: "415-771-7957"
    topics: [isolated older adults, holiday volunteering, visiting volunteers, referring a neighbor]
    source: https://www.littlebrotherssf.org/

  - name: Outer Sunset Neighbors
    role: neighbors working on safer streets, trees and greenery, and Sunset Dunes; monthly meetings and a third-Thursday happy hour
    reach: https://sunsetneighbors.org/
    topics: [street safety, trees, Sunset Dunes, neighborhood meetings, meeting neighbors]
    source: https://sunsetneighbors.org/

  - name: SF Fire Department NERT
    role: free Neighborhood Emergency Response Team training (six sessions) and neighborhood teams
    reach: https://sf-fire.org/NERT
    topics: [emergency preparedness, earthquake readiness, neighbor-to-neighbor response, disaster training]
    source: https://www.sf-fire.org/nert-calendar

  # Renting and repairs. Public lines, read Nov 17, 2026.
  - name: San Francisco Rent Board
    role: city agency that runs rent control; free counseling (415-252-4600), tenant petitions for rent reductions, and mediation
    reach: https://www.sf.gov/speak-rent-board-counselor
    topics: [renting, rent control, repairs, petitions, evictions, mediation]
    source: https://www.sf.gov/tenant-petitions

  - name: Housing Rights Committee of San Francisco
    role: tenant counseling nonprofit; the city's code enforcement outreach partner for the Sunset; may help tenants in a building organize (415-703-8644)
    reach: https://hrcsf.org/tenant-counseling-services
    topics: [renting, repairs, in-law units, tenant organizing, tenant counseling]
    source: https://www.sf.gov/code-enforcement-outreach-program

  - name: San Francisco Tenants Union
    role: volunteer-run tenant counseling clinic (drop-in at 558 Capp St; hours change weekly) and publisher of the Tenants' Rights Handbook
    reach: https://sftu.org/drop-in-clinic/
    topics: [renting, repairs, rent control, tenant organizing]
    source: https://sftu.org/schedule/

  - name: Open Door Legal (Sunset office)
    role: legal aid nonprofit with an office at 1722 Irving St; housing is one of its practice areas
    reach: https://opendoorlegal.org/contact
    topics: [legal aid, renting, housing]
    source: https://www.sf.gov/information--rent-board-referral-listing

  - name: Community Boards
    role: neighborhood mediation, citywide since 1976 (415-920-3820)
    reach: https://communityboards.org/resolution-services/neighborhood/
    topics: [mediation, neighbor disputes, landlord disputes]
    source: https://communityboards.org/about/faq/

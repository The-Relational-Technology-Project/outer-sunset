# Systems neighbors already built and can use. The agent points here before proposing anything new.
#
# Fields: name, what, url, answers (the questions this is the answer to), how_to_use, source

resources:
  - name: Community Supplies
    what: the Sunset and Richmond sharing community. Ladders, drills, a pressure washer, camping gear, books. Members lend to members.
    url: https://communitysupplies.org
    answers: [do we have a tool library, how do I borrow a ladder, can we start a tool-sharing thing, where can I lend my stuff]
    how_to_use: Join at communitysupplies.org and get vouched by a neighbor who's already in. Then browse and ask.
    source: https://communitysupplies.org

  - name: outersunset.today
    what: what's happening today and this week, the weekly email, the Arizmendi pizza ticker, local news
    url: https://outersunset.today
    answers: [what's happening today, what's on this weekend, what's the pizza, is there a newsletter]
    how_to_use: Open the site. Submit an event with the form there, or tell this agent.
    source: https://outersunset.today

  - name: outersunset.us
    what: the community guide; local groups by category, with how to join each one
    url: https://outersunset.us
    answers: [how do I meet people, is there a running group, where are the parent groups, how do I find a club]
    how_to_use: Browse by category. Show up to one thing.
    source: https://outersunset.us

  - name: Sunset Board
    what: fliers found on poles and boards in the Sunset, logged with dates and places, plus a calendar
    url: https://sunsetboard.org
    answers: [what classes are there, kids activities, what was on that flyer, where do I post a flyer]
    how_to_use: Browse, or add a flyer you found. Calendar feed at sunsetboard.org/calendar.ics.
    source: https://sunsetboard.org

  - name: SF Welcome Packet
    what: a welcome for new neighbors; an ambassador texts you a packet for your corner of the city
    url: https://sf.welcomepacket.org
    answers: [I just moved here, how do I welcome a new neighbor, is there a welcome packet]
    how_to_use: Fill in the form. Live in the Lower Haight first; ask whether the Sunset is on yet.
    source: https://sf.welcomepacket.org

  - name: Sunset Social Club
    what: a free club for the neighborhood, for anyone who lives in the Sunset or is a friend of it. Potlucks, pizza, workshops, tea and tai chi, a build-a-thon, and the Sunset Wave. Its vision is a Sunset where everyone knows someone on every block.
    url: https://sunsetsocialclub.org
    answers: [how do I join something, is there a social club, who knows everyone, how do I join the Sunset Social Club, when is the next Sunset Social Club event, I have an idea for a neighborhood gathering, how do I host a club event]
    how_to_use: Join at sunsetsocialclub.org/join with an email. Upcoming gatherings and RSVPs are at luma.com/sunsetsocialclub. Share an idea on the public board on the home page.
    source: https://sunsetsocialclub.org

  - name: The Sunset Wave
    what: neighbor gatherings on every block of the Sunset on one day, Saturday, March 20, 2027. The aim is 400. Neighbors host on their own block, with support from the Sunset Social Club.
    url: https://thesunsetwave.org
    answers: [what is the Sunset Wave, how do I host a block party, how do I host a gathering on my block, do I need a permit for a block party, is anyone hosting on my block, how do I meet the people on my block, when is the Sunset Wave, how do I sponsor or donate to the Sunset Wave, who organizes the Sunset Wave]
    how_to_use: Tap "Host on your block" at thesunsetwave.org and give your stretch, or find your block on the map to see if a neighbor has already raised a hand. Questions go to oursunsetsocialclub@gmail.com.
    source: https://thesunsetwave.org

  - name: SF311
    what: the city's line for reporting street and sidewalk problems, graffiti, potholes, trees, streetlights, noise, and more, and for checking a case
    url: https://sf311.org
    answers: [how do I report a pothole, who do I call about graffiti, how do I report a broken streetlight, how do I check my 311 case]
    how_to_use: Report in the SF311 app, at sf311.org, or by calling 311. Knowy can look up a case's status by its number.
    source: https://sf311.org

  - name: SF Planning Property Information Map
    what: the city's map of every planning application, permit, and zoning rule by address
    url: https://sfplanninggis.org/pim/
    answers: [what's being built at, is there a permit for, what's the zoning on, who's the planner for]
    how_to_use: Search an address or a record number. Knowy links each development to its page here.
    source: https://sfplanninggis.org/pim/

  - name: Relational Tech Project
    what: the group stewarding this agent and other neighborhood tools; runs build days
    url: https://relationaltechproject.org
    answers: [who built this, what's a build day, can I help build neighborhood tools]
    how_to_use: Email josh@relationaltechproject.org or come to a build day.
    source: STEWARDS.md

  # How things work here. Questions neighbors keep asking each other, answered with the city's own pages.
  - name: Street cleaning schedule
    what: San Francisco Public Works' street sweeping schedule, block by block
    url: https://sfpublicworks.org/services/mechanical-street-sweeping-and-street-cleaning-schedule
    answers: [when is street cleaning on my block, what days is street sweeping, where can I park without street cleaning, is there street cleaning on the Great Highway]
    how_to_use: Look up the street and block. The signs on the block are the last word, and they change, so read them when you park.
    source: https://sfpublicworks.org/services/mechanical-street-sweeping-and-street-cleaning-schedule

  - name: Street cleaning and meters on holidays
    what: SFMTA's list of which holidays street sweeping, meters, and other parking rules are enforced
    url: https://www.sfmta.com/getting-around/drive-park/holiday-enforcement-schedule
    answers: [is there street cleaning on a holiday, do I have to move my car on a holiday, are meters free today]
    how_to_use: Find the holiday in the table. Not every holiday is a day off for street sweeping.
    source: https://www.sfmta.com/getting-around/drive-park/holiday-enforcement-schedule

  - name: A car blocking a driveway
    what: SFMTA's text-before-tow program, and how a blocked driveway gets handled
    url: https://www.sfmta.com/text-tow-program
    answers: [a car is blocking my driveway, how do I get a car towed, how do I avoid getting towed, whose car is this]
    how_to_use: Sign your own car up so you get a text before a tow. For a car blocking you, report it to the city; a tow can take a while, so neighbors often ask around first.
    source: https://www.sfmta.com/text-tow-program

  - name: Report an abandoned vehicle
    what: the city's form for a car that has sat on the street without moving for a long time
    url: https://www.sf.gov/report-abandoned-vehicle
    answers: [a car has been parked here for weeks, how do I report an abandoned car]
    how_to_use: Report it on the city's page or through SF311.
    source: https://www.sf.gov/report-abandoned-vehicle

  - name: Where to vote
    what: the Department of Elections' map of polling places and wait times
    url: https://sfelections.org/tools/map_poll_time/
    answers: [where do I vote, where is my polling place, where can I drop off my ballot]
    how_to_use: Put in your address. Your polling place depends on where you live.
    source: https://sfelections.org/tools/map_poll_time/

  - name: Sand moving on Ocean Beach
    what: Public Works' yearly sand relocation, when trucks move sand along the beach near Noriega
    url: https://sfpublicworks.org/node/35693
    answers: [what are the trucks doing on the beach, why are they moving sand at Noriega, are they building dunes]
    how_to_use: It happens each year, usually starting in early June. The page has that year's dates.
    source: https://sfpublicworks.org/node/35693

  - name: A landlord offering a buyout
    what: the San Francisco Rent Board's rules on buyout agreements, and what a landlord has to tell a tenant first
    url: https://www.sf.gov/information--buyout-agreements
    answers: [my landlord wants to buy me out, what are my rights as a tenant, who do I call about a buyout, tenant help]
    how_to_use: Read the Rent Board's page before any conversation with the landlord, and call the Rent Board with questions. Neighbors also point to the San Francisco Tenants Union.
    source: https://www.sf.gov/information--buyout-agreements

  - name: A lost or loose dog
    what: San Francisco Animal Care and Control, the city shelter where found pets are taken and lost pets are reported
    url: https://www.sfanimalcare.org
    answers: [I found a dog, I lost my dog, there is a loose dog, I found a cat, who do I call about a stray]
    how_to_use: Report a sighting to Animal Care and Control, and don't chase or feed a frightened dog. Found pets are often taken there, and a shelter or vet can scan for a microchip.
    source: https://www.sfanimalcare.org

  - name: Donating books
    what: Friends of the San Francisco Public Library takes book donations
    url: https://www.friendssfpl.org/donatebooks.html
    answers: [where can I donate books, does the library take books]
    how_to_use: Check the page for how and when they take them. For a few books, neighbors use the little free libraries on the avenues.
    source: https://www.friendssfpl.org/donatebooks.html

  - name: A missing or broken trash bin
    what: Recology, which collects San Francisco's trash, recycling, and compost and replaces bins
    url: https://www.recology.com/recology-san-francisco/
    answers: [my compost bin is missing, my recycling bin was stolen, how do I get a new bin]
    how_to_use: Ask Recology for a replacement.
    source: https://www.recology.com/recology-san-francisco/

# Systems neighbors already built and can use. The agent points here before proposing anything new.
#
# Fields: name, what, url, answers (the questions this is the answer to), how_to_use, source

resources:
  - name: Community Supplies
    what: the Sunset and Richmond sharing community. Ladders, drills, a pressure washer, camping gear, books. Members lend to members.
    url: https://communitysupplies.org
    answers: [do we have a tool library, how do I borrow a ladder, can we start a tool-sharing thing, where can I lend my stuff]
    how_to_use: Join at communitysupplies.org and get vouched by a neighbor who's already in. Then browse and ask.
    source: https://communitysupplies.org

  - name: outersunset.today
    what: what's happening today and this week, the weekly email, the Arizmendi pizza ticker, local news
    url: https://outersunset.today
    answers: [what's happening today, what's on this weekend, what's the pizza, is there a newsletter]
    how_to_use: Open the site. Submit an event with the form there, or tell this agent.
    source: https://outersunset.today

  - name: outersunset.us
    what: the community guide; local groups by category, with how to join each one
    url: https://outersunset.us
    answers: [how do I meet people, is there a running group, where are the parent groups, how do I find a club]
    how_to_use: Browse by category. Show up to one thing.
    source: https://outersunset.us

  - name: Sunset Board
    what: fliers found on poles and boards in the Sunset, logged with dates and places, plus a calendar
    url: https://sunsetboard.org
    answers: [what classes are there, kids activities, what was on that flyer, where do I post a flyer]
    how_to_use: Browse, or add a flyer you found. Calendar feed at sunsetboard.org/calendar.ics.
    source: https://sunsetboard.org

  - name: SF Welcome Packet
    what: a welcome for new neighbors; an ambassador texts you a packet for your corner of the city
    url: https://sf.welcomepacket.org
    answers: [I just moved here, how do I welcome a new neighbor, is there a welcome packet]
    how_to_use: Fill in the form. Live in the Lower Haight first; ask whether the Sunset is on yet.
    source: https://sf.welcomepacket.org

  - name: Sunset Social Club
    what: a free club for the neighborhood, for anyone who lives in the Sunset or is a friend of it. Potlucks, pizza, workshops, tea and tai chi, a build-a-thon, and the Sunset Wave. Its vision is a Sunset where everyone knows someone on every block.
    url: https://sunsetsocialclub.org
    answers: [how do I join something, is there a social club, who knows everyone, how do I join the Sunset Social Club, when is the next Sunset Social Club event, I have an idea for a neighborhood gathering, how do I host a club event]
    how_to_use: Join at sunsetsocialclub.org/join with an email. Upcoming gatherings and RSVPs are at luma.com/sunsetsocialclub. Share an idea on the public board on the home page.
    source: https://sunsetsocialclub.org

  - name: The Sunset Wave
    what: neighbor gatherings on every block of the Sunset on one day, Saturday, March 20, 2027. The aim is 400. Neighbors host on their own block, with support from the Sunset Social Club.
    url: https://thesunsetwave.org
    answers: [what is the Sunset Wave, how do I host a block party, how do I host a gathering on my block, do I need a permit for a block party, is anyone hosting on my block, how do I meet the people on my block, when is the Sunset Wave, how do I sponsor or donate to the Sunset Wave, who organizes the Sunset Wave]
    how_to_use: Tap "Host on your block" at thesunsetwave.org and give your stretch, or find your block on the map to see if a neighbor has already raised a hand. Questions go to oursunsetsocialclub@gmail.com.
    source: https://thesunsetwave.org

  - name: SF311
    what: the city's line for reporting street and sidewalk problems, graffiti, potholes, trees, streetlights, noise, and more, and for checking a case
    url: https://sf311.org
    answers: [how do I report a pothole, who do I call about graffiti, how do I report a broken streetlight, how do I check my 311 case]
    how_to_use: Report in the SF311 app, at sf311.org, or by calling 311. Knowy can look up a case's status by its number.
    source: https://sf311.org

  - name: SF Planning Property Information Map
    what: the city's map of every planning application, permit, and zoning rule by address
    url: https://sfplanninggis.org/pim/
    answers: [what's being built at, is there a permit for, what's the zoning on, who's the planner for]
    how_to_use: Search an address or a record number. Knowy links each development to its page here.
    source: https://sfplanninggis.org/pim/

  - name: Relational Tech Project
    what: the group stewarding this agent and other neighborhood tools; runs build days
    url: https://relationaltechproject.org
    answers: [who built this, what's a build day, can I help build neighborhood tools]
    how_to_use: Email josh@relationaltechproject.org or come to a build day.
    source: STEWARDS.md

  # How things work here. Questions neighbors keep asking each other, answered with the city's own pages.
  - name: Street cleaning schedule
    what: San Francisco Public Works' street sweeping schedule, block by block
    url: https://sfpublicworks.org/services/mechanical-street-sweeping-and-street-cleaning-schedule
    answers: [when is street cleaning on my block, what days is street sweeping, where can I park without street cleaning, is there street cleaning on the Great Highway]
    how_to_use: Look up the street and block. The signs on the block are the last word, and they change, so read them when you park.
    source: https://sfpublicworks.org/services/mechanical-street-sweeping-and-street-cleaning-schedule

  - name: Street cleaning and meters on holidays
    what: SFMTA's list of which holidays street sweeping, meters, and other parking rules are enforced
    url: https://www.sfmta.com/getting-around/drive-park/holiday-enforcement-schedule
    answers: [is there street cleaning on a holiday, do I have to move my car on a holiday, are meters free today]
    how_to_use: Find the holiday in the table. Not every holiday is a day off for street sweeping.
    source: https://www.sfmta.com/getting-around/drive-park/holiday-enforcement-schedule

  - name: A car blocking a driveway
    what: SFMTA's text-before-tow program, and how a blocked driveway gets handled
    url: https://www.sfmta.com/text-tow-program
    answers: [a car is blocking my driveway, how do I get a car towed, how do I avoid getting towed, whose car is this]
    how_to_use: Sign your own car up so you get a text before a tow. For a car blocking you, report it to the city; a tow can take a while, so neighbors often ask around first.
    source: https://www.sfmta.com/text-tow-program

  - name: Report an abandoned vehicle
    what: the city's form for a car that has sat on the street without moving for a long time
    url: https://www.sf.gov/report-abandoned-vehicle
    answers: [a car has been parked here for weeks, how do I report an abandoned car]
    how_to_use: Report it on the city's page or through SF311.
    source: https://www.sf.gov/report-abandoned-vehicle

  - name: Where to vote
    what: the Department of Elections' map of polling places and wait times
    url: https://sfelections.org/tools/map_poll_time/
    answers: [where do I vote, where is my polling place, where can I drop off my ballot]
    how_to_use: Put in your address. Your polling place depends on where you live.
    source: https://sfelections.org/tools/map_poll_time/

  - name: Sand moving on Ocean Beach
    what: Public Works' yearly sand relocation, when trucks move sand along the beach near Noriega
    url: https://sfpublicworks.org/node/35693
    answers: [what are the trucks doing on the beach, why are they moving sand at Noriega, are they building dunes]
    how_to_use: It happens each year, usually starting in early June. The page has that year's dates.
    source: https://sfpublicworks.org/node/35693

  - name: A landlord offering a buyout
    what: the San Francisco Rent Board's rules on buyout agreements, and what a landlord has to tell a tenant first
    url: https://www.sf.gov/information--buyout-agreements
    answers: [my landlord wants to buy me out, what are my rights as a tenant, who do I call about a buyout, tenant help]
    how_to_use: Read the Rent Board's page before any conversation with the landlord, and call the Rent Board with questions. Neighbors also point to the San Francisco Tenants Union.
    source: https://www.sf.gov/information--buyout-agreements

  - name: A lost or loose dog
    what: San Francisco Animal Care and Control, the city shelter where found pets are taken and lost pets are reported
    url: https://www.sfanimalcare.org
    answers: [I found a dog, I lost my dog, there is a loose dog, I found a cat, who do I call about a stray]
    how_to_use: Report a sighting to Animal Care and Control, and don't chase or feed a frightened dog. Found pets are often taken there, and a shelter or vet can scan for a microchip.
    source: https://www.sfanimalcare.org

  - name: Donating books
    what: Friends of the San Francisco Public Library takes book donations
    url: https://www.friendssfpl.org/donatebooks.html
    answers: [where can I donate books, does the library take books]
    how_to_use: Check the page for how and when they take them. For a few books, neighbors use the little free libraries on the avenues.
    source: https://www.friendssfpl.org/donatebooks.html

  - name: A missing or broken trash bin
    what: Recology, which collects San Francisco's trash, recycling, and compost and replaces bins
    url: https://www.recology.com/recology-san-francisco/
    answers: [my compost bin is missing, my recycling bin was stolen, how do I get a new bin]
    how_to_use: Ask Recology for a replacement.
    source: https://www.recology.com/recology-san-francisco/

  # Looking out for each other. Details and sources are in the note "How neighbors in the Outer Sunset are doing".
  - name: Food pantries and free groceries
    what: the SF-Marin Food Bank's locator for weekly pantries, senior food boxes, and home-delivered groceries. Sunset sites in the city's 2026 guide are 3010 Noriega St, 2540 Taraval St, and 1740 Sloat Blvd.
    url: https://www.sfmfoodbank.org/find-food/
    answers: [where is a food pantry near me, a neighbor needs groceries, is there free food in the Sunset, how do I get groceries delivered to a senior, where can I volunteer at a pantry]
    how_to_use: Search the locator by ZIP code or call 415-282-1900. For home-delivered groceries call 415-824-3663. Days and hours change, so check before going.
    source: https://www.sfmfoodbank.org/find-food/

  - name: Friendship Line
    what: the Institute on Aging's free 24-hour support line for older adults, adults with disabilities, and caregivers, with check-in calls on request
    url: https://www.ioaging.org/services/friendship-line/
    answers: [my neighbor is lonely, who can call an older person who lives alone, is there a line in Cantonese, someone to talk to at night]
    how_to_use: Call 888-670-1360 (English), 888-670-2504 (Cantonese and Mandarin), 888-560-7360 (Russian), or 888-571-0411 (Spanish). To get regular calls, fill out the intake form on the page.
    source: https://www.ioaging.org/services/friendship-line/

  - name: Worried about a neighbor
    what: who to call in San Francisco when you have not seen someone or they seem unwell
    url: https://www.sanfranciscopolice.org/node/4321
    answers: [I have not seen my neighbor in days, how do I ask for a welfare check, who do I call besides 911, someone on my block seems to be in crisis, which neighbors could use extra care]
    how_to_use: Knock first and leave a note. For danger to life or a medical or mental health emergency call 911. For a wellness check that is not urgent, the police non-emergency line is 415-553-0123. For someone in crisis on the street, ask 311 for the Street Team.
    source: https://www.sf.gov/san-francisco-street-team

  - name: Help for an older or disabled neighbor
    what: the Department of Disability and Aging Services' Benefits and Resource Hub, which connects people to meals, home care, senior centers, and benefits
    url: https://www.sfhsa.org/services/disability-aging
    answers: [my neighbor needs help at home, where is the senior center, how does an older person get meals, who helps seniors in the Sunset, help for a caregiver]
    how_to_use: Call 415-355-6700. Sunset sites include the South Sunset Senior Center (2601 40th Ave) and Chi Sing Community Center (3133 Taraval St).
    source: https://www.sfhsa.org/services/disability-aging

  - name: AlertSF and NERT
    what: the city's emergency text alerts, and the Fire Department's free neighbor emergency training
    url: https://sf-fire.org/NERT
    answers: [how do I get storm alerts, how do I get ready for an earthquake with my neighbors, is there a NERT team in the Sunset, when is the next NERT class]
    how_to_use: Text your ZIP code to 888-777 for alerts. For training, pick a NERT Basic Training on the calendar at sf-fire.org/nert-calendar.
    source: https://www.sf-fire.org/nert-calendar

  # Renting and repairs. Details and sources are in the note "Getting repairs done when you rent in the Outer Sunset".
  - name: Getting a landlord to make repairs
    what: 'the usual ladder for a renter: a dated letter listing what needs fixing, a second letter, then a city housing inspector, then a Rent Board petition for lower rent. A tenant counselor can say what fits your case.'
    url: https://www.sf.gov/speak-rent-board-counselor
    answers: [how do I get my super to take care of things in the building, my landlord won't fix things, how do I get my landlord to make repairs, the building is falling apart, who do I call about my landlord]
    how_to_use: Write to the landlord and keep a copy. If nothing happens, call the Rent Board counseling line, 415-252-4600, or the Housing Rights Committee, 415-703-8644, before the next step. If other units have the same problems, write together.
    source: https://www.sf.gov/speak-rent-board-counselor

  - name: City housing complaint (DBI Housing Inspection Services)
    what: a complaint about living conditions in a rental. The city says an inspector investigates within 72 hours and can issue a Notice of Violation. It can be anonymous; records are public.
    url: https://www.sf.gov/report-building-problem
    answers: [my landlord won't fix the heat, how do I report my landlord to the city, who do I call about no hot water, how do I get a housing inspector, how do I file a complaint about my apartment]
    how_to_use: File online, call 311, or call 628-652-3700 with questions. If the unit may be an in-law without permits, talk to a tenant counselor first; an inspector can cite the unit itself.
    source: https://www.sf.gov/get-help-reporting-substandard-living-conditions

  - name: SF Rent Board counseling line
    what: free phone and drop-in counseling on rent control, repairs petitions and evictions, in English, Spanish, Cantonese and Mandarin. Not legal advice.
    url: https://www.sf.gov/speak-rent-board-counselor
    answers: [is my place rent controlled, can I get my rent lowered because of repairs, who can I ask about my rights as a tenant, what is the Rent Board phone number]
    how_to_use: Call 415-252-4600, Monday to Friday 9 AM to noon and 1 to 4 PM, or drop in at 25 Van Ness Ave, Suite 700, weekdays 9 AM to 4 PM. Write your questions down first.
    source: https://www.sf.gov/speak-rent-board-counselor

  - name: Rent reduction when repairs are not made
    what: the Rent Board's decrease in housing services petition (Form 516A) for rent-controlled tenants. No filing fee. The Rent Board can lower rent but cannot order repairs.
    url: https://www.sf.gov/request-rent-reduction-decreased-housing-services
    answers: [can I pay less rent if my landlord won't fix things, what is a decrease in services petition, my landlord took away parking or laundry, can I get a rent reduction for no heat]
    how_to_use: Fill out Form 516A, list each lost service and the dates you told the landlord, and send it with evidence to the Rent Board.
    source: https://www.sf.gov/request-rent-reduction-decreased-housing-services

  - name: Housing Rights Committee tenant counseling
    what: free tenant counseling. The city's assigned code enforcement outreach partner for Sunset addresses; helps write to the landlord and acts as a go-between with inspectors. Rent control not required.
    url: https://hrcsf.org/tenant-counseling-services
    answers: [who can help me get my landlord to make repairs, I live in an in-law without permits and need repairs, is there a tenant counselor, who helps tenants organize a building]
    how_to_use: Call 415-703-8644 and leave a message, or go to 11 Grove St, Monday to Thursday 1 to 5 PM.
    source: https://www.sf.gov/code-enforcement-outreach-program

  - name: A building's complaint and permit history
    what: the city's Permit and Complaint Tracking System, where any address shows past complaints, Notices of Violation and permits
    url: https://dbiweb02.sfgov.org/dbipts/
    answers: [has my building had complaints before, how do I check permits on a house, how do I track my housing complaint]
    how_to_use: Search by street address or complaint number.
    source: https://www.sf.gov/report-building-problem

  - name: Mediation with a neighbor or a landlord who lives nearby
    what: Community Boards, voluntary and confidential mediation with trained volunteers. Mediation is free; there is a case opening fee on a sliding scale that can be waived.
    url: https://communityboards.org/resolution-services/neighborhood/
    answers: [my landlord lives upstairs and I don't want a fight, is there mediation with a landlord, I have a dispute with a neighbor, is there free mediation]
    how_to_use: Call 415-920-3820 for a first conversation. Staff contact the other person.
    source: https://communityboards.org/about/faq/

  # Water. Details and sources are in the note "Where the water comes from".
  - name: What is in the tap water
    what: the SFPUC's yearly water quality report, on what is in San Francisco tap water, where it came from, and lead results; the 2025 report is the latest
    url: https://www.sfpuc.gov/accounts-services/water-quality/annual-water-quality-reports
    answers: [is the tap water safe, what is in my water, is there fluoride in the water, how hard is the water, where does the water come from]
    how_to_use: Open the San Francisco report. Questions go to the SFPUC at 650-652-3100.
    source: https://www.sfpuc.gov/sites/default/files/accounts-and-services/water-quality/water-quality-en-SF-2025.pdf

  - name: Lead test for your tap
    what: the SFPUC's lead test ($25 a tap; free for WIC families and for customers who own a galvanized service line) and its map of service lines by address
    url: https://www.sfpuc.gov/leadtest
    answers: [how do I test my water for lead, do I have lead pipes, is the lead test free, my house is old is the water ok]
    how_to_use: Fill in the Lead Testing Application on the page. Use the map on the same page for your address. Call 650-652-3100 with questions.
    source: https://www.sfpuc.gov/leadtest

  - name: Saving water
    what: the SFPUC's free faucet aerators, showerheads and toilet flappers, leak alerts, and rebates for rain barrels, cisterns and laundry-to-landscape
    url: https://www.sfpuc.gov/learning/conserve-water
    answers: [how do I lower my water bill, where do I get a free showerhead, I got a leak alert, is there a rain barrel rebate, can I water my garden with laundry water]
    how_to_use: Call 415-551-4730 or see the page for where to pick up free devices; bring proof of address.
    source: https://www.sfpuc.gov/learning/conserve-water/free-evaluations-and-devices/water-saving-devices

  - name: Storing water for an earthquake
    what: the SFPUC's page on how much emergency water to keep, how to store it, and how to disinfect water
    url: https://www.sfpuc.gov/learning/emergency-preparedness/storing-and-treating-water
    answers: [how much water should I store, will the water be out after an earthquake, can I drink water from my water heater, how do I purify water]
    how_to_use: Store one gallon per person per day for 3 to 5 days and replace it every six months.
    source: https://www.sfpuc.gov/learning/emergency-preparedness/storing-and-treating-water
